<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台積電 2026 Q1 法說會儀表板</title>
<style>
:root{
  --ink:#0d0d0d; --grey:#717171; --app:#f8f8f8; --surface:#fff; --line:#dadada;
  --primary:#1970b8; --link:#186eb4; --navy:#204383; --deep:#0b2140; --deep2:#12305c;
  --cyan:#2cb1b1; --tint:rgba(32,67,131,.1); --mark:#fff3a6; --on-dark:#e9f1fa; --on-dark-2:#9fb4cf;
  --hdr:64px; --slant:clamp(16px,3.5vw,56px);
  --up:#d62f3c; --down:#14915a; --hdr-bg:rgba(255,255,255,.92); --back:#f3f7fb; --foot:#eeeeee; --input:#ffffff; --rail:#e8edf3; --rail-l:#c9d3df; --pin-ring:#ffffff;
  --font:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ink:#e8ecf1; --grey:#9aa6b2; --app:#0f1318; --surface:#181d24; --line:#2c3440;
  --primary:#4d9ee0; --link:#7db8ec; --navy:#a9c3e6; --tint:rgba(169,195,230,.14); --mark:#6b5d12;
  --hdr-bg:rgba(15,19,24,.9); --back:#1c2633; --foot:#151a20; --input:#11161c; --rail:#2a3442; --rail-l:#1f2833; --pin-ring:#181d24; --deep:#0a1a33; --up:#ff6b74; --down:#3ccf8e;}}
:root[data-theme="dark"]{--up:#ff6b74; --down:#3ccf8e; color-scheme:dark; --ink:#e8ecf1; --grey:#9aa6b2; --app:#0f1318; --surface:#181d24; --line:#2c3440;
  --primary:#4d9ee0; --link:#7db8ec; --navy:#a9c3e6; --tint:rgba(169,195,230,.14); --mark:#6b5d12;
  --hdr-bg:rgba(15,19,24,.9); --back:#1c2633; --foot:#151a20; --input:#11161c; --rail:#2a3442; --rail-l:#1f2833; --pin-ring:#181d24; --deep:#0a1a33;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr-bg)}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--app);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.dark :focus-visible{outline-color:#fff}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);color:var(--ink);padding:8px 12px}

/* ── header ── */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hdr);background:var(--hdr-bg);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
header .wrap{height:100%;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand img{height:34px;width:auto;border-radius:6px}
footer img{border-radius:6px}
.logo-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d{display:inline-block!important}}
:root[data-theme="dark"] .logo-l{display:none!important}:root[data-theme="dark"] .logo-d{display:inline-block!important}
.brand b{display:block;font-size:17px;letter-spacing:1px;line-height:1.15}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--grey);letter-spacing:.3px}
nav.toc{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:safe center}
nav.toc::-webkit-scrollbar{display:none}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--grey);font-size:14px;font-weight:600;padding:6px 10px;border-radius:4px;transition:color .2s,background .2s}
nav.toc a:hover{color:var(--link)}
nav.toc a.on{color:var(--primary);background:rgba(25,112,184,.1)}
.search{display:flex;align-items:center;gap:6px;flex-shrink:0}
.search input{width:180px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:14px;background:var(--input);color:var(--ink);transition:width .25s}
.search input:focus{width:240px;outline:2px solid var(--primary);outline-offset:-1px}
.search .hits{font-size:13px;color:var(--grey);white-space:nowrap;display:none;align-items:center;gap:4px}
.search .hits.show{display:flex}
.search .hits button{border:1px solid var(--primary);background:var(--surface);color:var(--primary);border-radius:4px;height:28px;padding:0 8px;font-size:12px;font-weight:600}
.progress{position:absolute;left:0;bottom:-1px;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--primary)}
mark{background:var(--mark);color:inherit;padding:0 1px}
mark.cur{outline:2px solid var(--primary)}

/* ── shared section ── */
section{position:relative;padding:88px 0}
section.dark{background:var(--deep);color:var(--on-dark);clip-path:polygon(0 var(--slant),100% 0,100% calc(100% - var(--slant)),0 100%);padding:calc(88px + var(--slant)) 0;margin:calc(var(--slant) * -1) 0}
section.dark::before,.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:28px}
.sec-no{font-size:14px;font-weight:700;color:var(--primary);border:1.5px solid currentColor;border-radius:4px;padding:1px 7px;line-height:1.5}
.dark .sec-no{color:#7fb6e6}
.sec-head h2{margin:0;font-size:clamp(26px,3.6vw,40px);line-height:1.2;letter-spacing:.5px}
.dark .sec-head h2{color:#fff}
.lead{max-width:760px;font-size:17px;line-height:1.85;margin:0 0 12px}
.dark .lead{color:var(--on-dark)}
.sub{font-size:14px;color:var(--grey)}
.dark .sub{color:var(--on-dark-2)}
.quote{font-size:14px;line-height:1.6;color:var(--grey)}
.quote::before{content:"原文　";font-weight:700;color:var(--navy)}
.dark .quote{color:var(--on-dark-2)}.dark .quote::before{color:#7fb6e6}

/* chips */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--primary);color:var(--primary)}
.chip.fmt{border-color:transparent;background:var(--tint);color:var(--navy)}
.chip.flat{border-color:var(--line);color:var(--grey)}
.chip.solid{background:var(--primary);color:#fff}
.dark .chip{border-color:#7fb6e6;color:#a9d0f2}
.dark .chip.fmt{background:rgba(255,255,255,.12);color:#dbe7f5;border-color:transparent}
.dark .chip.flat{border-color:rgba(255,255,255,.28);color:var(--on-dark-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* reveal: only one orchestrated entrance per section */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* ── hero ── */
.hero{position:relative;background:var(--deep);color:var(--on-dark);padding:72px 0 calc(110px + var(--slant));clip-path:polygon(0 0,100% 0,100% calc(100% - var(--slant)),0 100%);overflow:hidden}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.hero .wrap.solo{grid-template-columns:minmax(0,820px)}
.crumb{font-size:14px;color:var(--on-dark-2);margin-bottom:14px}
.crumb span+span::before{content:"／";margin:0 6px;opacity:.6}
.hero h1{margin:0 0 20px;font-size:clamp(32px,5.2vw,58px);line-height:1.12;color:#fff;letter-spacing:1px}
.hero h1 .tk{display:block;font-size:.42em;letter-spacing:2px;color:#7fb6e6;margin-bottom:10px;font-weight:700}
.hero .summary{font-size:17px;line-height:1.9;max-width:620px;color:var(--on-dark);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:36px;border-top:1px solid rgba(255,255,255,.18)}
.stat{padding:16px 12px 0 0}
.stat b{display:block;font-size:clamp(28px,3.4vw,40px);line-height:1.1;color:#fff}
.stat span{font-size:13px;color:var(--on-dark-2)}
.dial-box{position:relative;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none}
.dial-box svg{width:100%;max-width:600px;height:auto;display:block;margin:0 auto;overflow:visible;cursor:grab}
.dial-box svg:active{cursor:grabbing}
.dial-label{margin-top:-6px}
.dial-label small{display:block;font-size:13px;color:var(--on-dark-2)}
.dial-label strong{display:block;font-size:52px;line-height:1.2;color:#fff;letter-spacing:4px}
.dial-hint{font-size:12.5px;color:var(--on-dark-2);margin-top:6px;opacity:.85}
.seg{transition:fill .25s}
.cue{position:absolute;left:50%;bottom:calc(var(--slant) + 24px);transform:translateX(-50%);font-size:12px;color:var(--on-dark-2);text-align:center;letter-spacing:2px}
.cue i{display:block;width:12px;height:12px;margin:6px auto 0;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px) rotate(45deg)}}

/* ── outlook horizontal sequence ── */
.hs{position:relative}
.hs-sticky{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hs-sticky>.wrap{width:100%}
.hs-title{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}.hs-title b{font-size:20px;color:var(--link)}
.hs-bar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.hs-count{font-size:14px;font-weight:700;color:var(--navy);white-space:nowrap;min-width:108px}
.hs-count b{font-size:26px;color:var(--primary);margin-right:2px}
.ticks{display:flex;gap:4px;flex:1}
.ticks i{flex:1;height:8px;background:rgba(25,112,184,.13);transition:background .3s}
.ticks i.up{box-shadow:inset 0 -3px 0 var(--navy)}
.ticks i.on{background:var(--primary)}
.hs-legend{font-size:12.5px;color:var(--grey);white-space:nowrap}
.hs-legend i{display:inline-block;width:14px;height:8px;background:rgba(25,112,184,.13);box-shadow:inset 0 -3px 0 var(--navy);vertical-align:middle;margin-right:4px}
.track{display:flex;gap:20px;will-change:transform;padding:8px 20px 24px max(20px,calc((100vw - 1200px)/2 + 20px))}
.gcard{flex:0 0 min(380px,82vw);background:var(--surface);border:1px solid var(--line);padding:22px 22px 18px;position:relative;display:flex;flex-direction:column;gap:10px;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s;min-height:360px}
.gcard.up{border-top:4px solid var(--primary)}
.gcard.act{transform:translateY(-8px);border-color:var(--primary);box-shadow:8px 8px 0 rgba(25,112,184,.16)}
.gcard .idx{position:absolute;right:16px;top:10px;font-size:52px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(25,112,184,.25)}
.gcard h3{margin:4px 0 0;font-size:21px;color:var(--link);padding-right:64px}
.gcard .val{font-size:19px;font-weight:700;line-height:1.45}
.gcard .quote{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);max-height:9.6em;overflow:auto}
.end-card{flex:0 0 min(300px,70vw);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px;color:var(--navy)}
.end-card b{font-size:22px}

/* ── conclusion + rating blocks ── */
.cr{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.meter{margin-bottom:30px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.meter-top span{font-weight:700;color:#fff;font-size:17px}
.meter-top b{font-size:34px;color:#fff;line-height:1}
.meter-top b small{font-size:15px;color:var(--on-dark-2);margin-left:2px}
.blocks{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.blocks i{height:18px;background:rgba(255,255,255,.1);transition:background .2s}
.blocks i.f{background:#4d9ee0}
.blocks.navy i.f{background:#a9c3e6}
.meter p{margin:8px 0 0;font-size:14px;color:var(--on-dark-2)}

/* ── key data flip cards ── */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;perspective:1100px}
.kcard{position:relative;height:230px;border:0;padding:0;background:none;text-align:left;cursor:pointer;outline-offset:3px;transform-style:preserve-3d;transition:transform .12s ease-out}
.kcard .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.kcard.flip .in{transform:rotateY(180deg)}
.kface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:6px}
.kface.back{transform:rotateY(180deg);background:var(--back);border-color:var(--primary);overflow:auto}
.kface .m{font-weight:700;color:var(--link);font-size:19px;line-height:1.35}
.kface.back .m{font-size:16px}
.kface .v{font-size:24px;font-weight:700;line-height:1.25;margin-top:auto}
.kface .c{font-size:14px;color:var(--grey)}
.kface .row{display:flex;justify-content:space-between;align-items:center}
.kface .flip-hint{font-size:12px;color:var(--grey)}
.kface.back .quote{font-size:14.5px;color:var(--ink);opacity:.85}
.kcard:hover .kface.front{border-color:var(--primary)}
.kshine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(25,112,184,.12),transparent 55%);opacity:0;transition:opacity .2s}
.kcard:hover .kshine{opacity:1}

/* ── tone ── */
.tone-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tone-card{background:var(--surface);border:1px solid var(--line);padding:22px}
.tone-card h3{margin:0 0 4px;font-size:18px;color:var(--link)}
.tone-score{font-size:46px;font-weight:700;line-height:1.1;margin:6px 0 14px}
.scale{position:relative;height:36px;margin:0 6px 28px}
.scale .rail{position:absolute;left:0;right:0;top:14px;height:8px;background:linear-gradient(90deg,var(--rail-l),var(--rail) 50%,rgba(77,158,224,.4));}
.scale .mid{position:absolute;left:50%;top:6px;width:1px;height:24px;background:var(--grey)}
.scale .pin{position:absolute;top:2px;left:50%;width:16px;height:32px;margin-left:-8px;background:var(--primary);border:3px solid var(--pin-ring);box-shadow:0 0 0 1px var(--primary);transition:left 1.4s cubic-bezier(.2,.9,.3,1.15)}
.scale .lbl{position:absolute;top:38px;font-size:12px;color:var(--grey);transform:translateX(-50%)}
.tone-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.tone-card dt{color:var(--grey)}
.tone-card dd{margin:0}

/* ── QA ── */
.dist{display:flex;height:14px;margin:6px 0 10px;overflow:hidden}
.dist i{height:100%;transition:flex-grow 1s cubic-bezier(.2,.8,.2,1)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.tab{border:1.5px solid rgba(255,255,255,.3);background:transparent;color:var(--on-dark);border-radius:4px;height:36px;padding:0 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s,transform .15s}
.tab:active{transform:scale(.96)}
.tab i{width:10px;height:10px;display:inline-block}
.tab em{font-style:normal;font-size:12px;opacity:.75}
.tab[aria-pressed=true]{background:#fff;color:var(--deep);border-color:#fff}
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);transition:background .2s,opacity .3s,transform .3s}
.qitem.hide{display:none}
.qitem.open{background:rgba(255,255,255,.1);border-color:rgba(127,182,230,.6)}
.qbtn{width:100%;display:grid;grid-template-columns:44px 1fr auto 32px;gap:12px;align-items:center;background:none;border:0;padding:14px 16px;text-align:left}
.qno{font-weight:700;color:#7fb6e6;font-size:15px}
.qq{font-weight:700;color:#fff;font-size:16.5px;line-height:1.5}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.qtag{font-size:13px;color:var(--on-dark-2);align-self:center;margin-right:4px;border-left:1px solid rgba(255,255,255,.28);padding-left:8px}
.plus{width:28px;height:28px;border:1.5px solid rgba(255,255,255,.6);position:relative;transition:transform .3s}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;background:#fff;transform:translate(-50%,-50%)}
.plus::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .3s}
.qitem.open .plus{transform:rotate(180deg)}.qitem.open .plus::after{transform:translate(-50%,-50%) rotate(0)}
.qbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.qitem.open .qbody{grid-template-rows:1fr}
.qbody>div{overflow:hidden}
.qbody .pad{padding:0 16px 16px 72px}
.qbody .ans{margin:0 0 8px;font-size:15.5px;color:#fff}
.qbody .who{font-size:13px;color:var(--on-dark-2);margin-bottom:6px}

/* ── attendees & keywords ── */
.ak{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:start}
.att{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.att div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.att b{color:var(--link)}
.att p{margin:0}.att small{display:block;color:var(--grey);font-size:13px}
.pit{position:relative;height:380px;background:var(--surface);border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.pit::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--primary)}
.ball{position:absolute;left:0;top:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:grab;will-change:transform;line-height:1.15;font-weight:700;padding:4px}
.ball:active{cursor:grabbing}
.ball.pos{background:var(--primary);color:#fff}
.ball.risk{background:var(--surface);border:2px solid var(--navy);color:var(--navy)}
.ball small{font-weight:600;opacity:.8;font-size:11px;margin-top:2px}
.pit-legend{display:flex;gap:16px;font-size:13px;color:var(--grey);margin-top:10px;flex-wrap:wrap}
.pit-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px;background:var(--primary)}
.pit-legend i.r{background:var(--surface);border:2px solid var(--navy)}
.pit-reset{margin-left:auto;border:1px solid var(--primary);background:var(--surface);color:var(--primary);border-radius:4px;font-size:12px;font-weight:600;height:26px;padding:0 10px}

/* ── footer ── */
footer{background:var(--foot);padding:40px 0 48px;margin-top:40px;font-size:14.5px;line-height:1.8}
footer img{height:60px;width:auto;margin-bottom:10px}
footer p{margin:0}

.top{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:var(--primary);color:#fff;box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;transform:translateY(10px);z-index:40}
.top.show{opacity:1;pointer-events:auto;transform:none}
.top svg{width:18px;height:18px}


/* ── 動作按鈕、前次數值 ── */
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.abtn{border:1px solid var(--line);background:var(--surface);color:var(--link);border-radius:4px;height:30px;padding:0 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:border-color .2s,background .2s,color .2s}
.abtn:hover{border-color:var(--primary)}
.abtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.abtn svg{width:14px;height:14px;flex-shrink:0}
.dark .abtn{background:transparent;border-color:rgba(255,255,255,.3);color:#cfe2f6}
.dark .abtn.on{background:#fff;color:var(--deep);border-color:#fff}
.prior{font-size:14px;color:var(--grey);line-height:1.5}
.prior .pl{display:inline-block;font-size:12px;font-weight:700;color:var(--navy);background:var(--tint);padding:0 6px;border-radius:3px;margin-right:6px}
/* ── 首頁：這場的重點變化 ── */
.chg{margin-top:30px}
.chg-t{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.5}
.chg-t caption{text-align:left;font-size:13px;color:var(--on-dark-2);font-weight:500;padding-bottom:8px;line-height:1.6}
.chg-t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--on-dark-2);padding:8px 10px 8px 0;border-bottom:1px solid rgba(255,255,255,.3)}
.chg-t td{padding:10px 10px 10px 0;border-bottom:1px solid rgba(255,255,255,.12);vertical-align:top}
.chg-t td.k{color:#fff;font-weight:700;white-space:nowrap}
.chg-t td.f{color:var(--on-dark-2)}
.chg-t td.t{color:#fff;font-weight:700}
.chg-t td.r{text-align:right;padding-right:0}
.chg-t th:nth-child(2),.chg-t th:nth-child(3){width:36%}
.chg h2{font-size:14px;color:var(--on-dark-2);margin:0 0 4px;font-weight:600;letter-spacing:.5px}
.chg-row{display:grid;grid-template-columns:7.5em 1fr auto;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.16)}
.chg-row b{color:#fff;font-size:15px}
.chg-row .ft{font-size:15px;line-height:1.5}
.chg-row .from{color:var(--on-dark-2)}
.chg-row .arr{color:#7fb6e6;margin:0 6px}
.chg-row .to{color:#fff;font-weight:700}
.hero-acts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:6px;font-weight:700;font-size:15px;border:1.5px solid #fff;background:#fff;color:#0b2140;display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn svg{width:18px;height:18px}
/* ── header 報告稿按鈕 ── */
.hbtn{height:36px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;font-size:14px;padding:0 12px;display:inline-flex;gap:6px;align-items:center;flex-shrink:0;white-space:nowrap}
.hbtn .n{min-width:20px;height:20px;border-radius:10px;background:#fff;color:#1970b8;font-size:12px;display:none;align-items:center;justify-content:center;padding:0 5px}
.hbtn .n.show{display:inline-flex}
.hbtn.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.12)}}
/* ── 抽屜：報告稿＋逐字稿 ── */
.scrim{position:fixed;inset:0;background:rgba(5,15,30,.45);z-index:79;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--surface);color:var(--ink);z-index:80;transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dw-head{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dw-tab{border:0;background:none;font-size:16px;font-weight:700;color:var(--grey);padding:6px 10px;border-radius:4px}
.dw-tab[aria-selected=true]{color:var(--primary);background:rgba(25,112,184,.1)}
.dw-close{margin-left:auto;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:20px;line-height:1;color:var(--ink)}
.dw-pane{flex:1;display:none;flex-direction:column;min-height:0}
.dw-pane.on{display:flex}
.fmts{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 0}
.fmt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;height:34px;padding:0 12px;font-size:14px;font-weight:600}
.fmt[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.fmt em{font-style:normal;font-size:12px;opacity:.8;margin-left:4px}
.fmt-desc{padding:8px 16px 0;font-size:13px;color:var(--grey);margin:0}
.draft{flex:1;margin:10px 16px 0;padding:14px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:15px;line-height:1.75;resize:none;background:var(--app);color:var(--ink);min-height:200px}
.draft:focus{outline:2px solid var(--primary);outline-offset:-1px}
.dw-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);margin-top:12px}
.dw-foot .cnt{font-size:13px;color:var(--grey);margin-right:auto}
.dw-foot .copy{height:40px;padding:0 18px;border-radius:6px;border:0;background:var(--primary);color:#fff;font-weight:700;font-size:15px}
.dw-foot .reset{height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--grey);font-size:14px;font-weight:600}
.src{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.src .sub{margin-left:auto}
.tx{flex:1;overflow:auto;padding:0 16px 24px;scroll-behavior:smooth}
.sg{padding:12px 0;border-bottom:1px solid var(--line);transition:background .4s}
.sg.target{background:rgba(25,112,184,.08);margin:0 -16px;padding:12px 16px 12px 13px;border-left:3px solid var(--primary)}
.sg-who{font-size:13px;font-weight:700;color:var(--link);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sg-who small{font-weight:500;color:var(--grey)}
.sg p{margin:4px 0 0;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--app);padding:10px 18px;border-radius:6px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:95}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ── 未來展望：清單模式 ── */
.hs-title{flex-wrap:wrap}
.hs-tools{margin-left:auto;display:flex;gap:6px}
.olist{display:none;padding:4px 0 8px}
.ow.list .hs{display:none}
.ow.list .olist{display:block}
.olist .tbl{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
.olist table{width:100%;border-collapse:collapse;min-width:900px;font-size:14.5px}
.olist .abtn{white-space:nowrap}
.olist th{background:var(--app);text-align:left;font-size:13px;color:var(--grey);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.olist td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.olist td.t{font-weight:700;color:var(--link);white-space:nowrap}
.olist td.p{color:var(--grey)}
.olist tr:last-child td{border-bottom:0}
@media (max-width:960px){ .chg-row{grid-template-columns:1fr auto} .chg-row .ft{grid-column:1/-1;grid-row:2} .hbtn .lbl{display:none} }
@media print{ .drawer,.scrim,.toast,.acts,.hero-acts,.hbtn{display:none!important} }


.rev{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;white-space:nowrap;line-height:1}
.rev svg{width:18px;height:12px;flex-shrink:0}
.rev.up{color:var(--up)}.rev.down{color:var(--down)}.rev.flat{color:var(--grey);font-weight:600}
.dark .rev.up,.hero .rev.up{color:#ff7a82}.dark .rev.down,.hero .rev.down{color:#4fd69a}.dark .rev.flat{color:var(--on-dark-2)}
.ticks i.up{box-shadow:inset 0 -3px 0 var(--up)!important}
.hs-legend i{box-shadow:inset 0 -3px 0 var(--up)!important}
.gcard.up{border-top-color:var(--up)!important}
/* 方法說明 */
.mth h3{font-size:17px;color:var(--link);margin:22px 0 8px}.mth h3:first-child{margin-top:4px}
.mth p,.mth li{font-size:14.5px;line-height:1.75;margin:0 0 6px}
.mth ul{padding-left:20px;margin:0 0 8px}
.mth table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.mth td,.mth th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.mth th{color:var(--grey);font-size:12.5px}
.mth tr.me td{background:rgba(25,112,184,.08)}
.mth tr.me td:first-child{font-weight:700;color:var(--primary)}
.mth .note{font-size:13px;color:var(--grey);background:var(--app);padding:10px 12px;border-radius:6px}
.mth details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0}
.mth summary{cursor:pointer;font-weight:700;font-size:14px}
.mth .wl{font-size:13.5px;line-height:1.9;color:var(--ink);margin-top:6px}
.dw-pane[data-pane=method]{overflow:auto;padding:16px}
/* 逐字稿：來源列可換行、找詞模式 */
.src{flex-wrap:wrap}
.src .sub{margin-left:0;flex-basis:100%;font-size:13px}
.wnav{display:none;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--app);font-size:14px;flex-wrap:wrap}
.wnav.on{display:flex}
.wnav b{color:var(--primary)}
.wnav .sp{margin-left:auto;display:flex;gap:6px}
.tx mark.cur{outline:2px solid var(--primary);outline-offset:1px}
/* 語調詞 */
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.wchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;height:30px;padding:0 11px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,transform .15s}
.wchip:hover{border-color:var(--primary)}.wchip:active{transform:scale(.96)}
.wchip em{font-style:normal;font-weight:700;color:var(--grey);font-size:12.5px}
.wchip.pos em{color:var(--primary)}.wchip.neg em{color:var(--up)}
.wchip .fl{font-size:11px;color:var(--grey)}
.tone-card h4{margin:14px 0 4px;font-size:13px;color:var(--grey);font-weight:600}
.linkish{border:0;background:none;color:var(--link);font-weight:700;font-size:14px;padding:0;text-decoration:underline;text-underline-offset:3px}
.dark .linkish{color:#a9d0f2}
/* 評價儀表說明 */
.dial-desc{font-size:15px;color:var(--on-dark);max-width:460px;margin:8px auto 0;min-height:3.2em;line-height:1.6}
.dial-desc small{display:block;color:var(--on-dark-2);font-size:12.5px;margin-top:2px}
/* 出席人員 */
.att-h{font-size:14px;color:var(--grey);font-weight:700;margin:18px 0 6px}
.att-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px;border-top:2px solid var(--ink)}
.att-grid.one{grid-template-columns:1fr}
.an{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.an b{color:var(--link)}.an span{font-size:13.5px;color:var(--grey)}.an em{font-style:normal;font-size:12.5px;color:var(--grey);grid-row:1/3;grid-column:2;align-self:center}
.qorg{font-size:13px;color:#dbe7f5;font-weight:600;white-space:nowrap;align-self:center}
.pick-empty{margin:10px 16px 0;padding:16px;border:1px dashed var(--line);border-radius:6px;font-size:14.5px;line-height:1.8;display:none}
.pick-empty.on{display:block}
.pick-empty ol{margin:6px 0 0;padding-left:20px}
@media (max-width:600px){ .att-grid{grid-template-columns:1fr} }

@media (max-width:1180px){ nav.toc{display:none} }
@media (max-width:960px){
  nav.toc{display:none}
  .search input{width:130px}.search input:focus{width:170px}
  .hero .wrap,.cr,.ak,.tone-grid{grid-template-columns:1fr}
  .hero .wrap{gap:28px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qbtn{grid-template-columns:32px 1fr 28px}.qmeta{grid-column:2;justify-content:flex-start}.plus{grid-row:1;grid-column:3}
  .qbody .pad{padding-left:16px}
}
@media (max-width:600px){ .brand small{display:none} .search input{width:96px} .hits .lbl{display:none} }
@media (max-width:420px){ header .wrap{gap:10px} .brand>span{display:none} .search input{width:120px} }
/* 手機與減少動態：橫向序列改成手指左右滑 */
.hs.static .hs-sticky{position:relative;top:0;height:auto;overflow:visible}
.hs.static .track{overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:20px;transform:none!important;padding-left:20px}
.hs.static .gcard{scroll-snap-align:start}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  .cue i{animation:none}
  .kcard .in,.scale .pin,.qbody,.blocks i{transition:none}
}
@media print{
  header,.top,.cue,.dial-hint,.pit,.pit-legend,.tabs{display:none}
  section.dark,.hero{background:#fff;color:#000;clip-path:none}
  .rv{opacity:1;transform:none}
  .hs-sticky{position:static;height:auto}.track{flex-wrap:wrap;transform:none!important}
  .qbody{grid-template-rows:1fr}
}
</style>

n of 1 US dollar to 31.7 NT, gross margin is expected to be between 65.5% and 67.5%, operating margin between 56.5% and 58.5%."}, {"topic": "全年營收成長", "period": "2026 全年", "value": "美元營收成長 30% 以上（Q&A 口述為 20% 以上）", "direction": "成長", "vs_prior": "上修", "std": "revenue_growth", "low": 30, "high": 30, "unit": "%", "prior_value": "接近 30%", "prior_quote": "We expect 2026 to be another strong growth year for TSMC and forecast our full year revenue to increase by close to 30% in US dollar terms.", "quote": "Supported by our robust technology differentiation and broad customer base, we maintain strong confidence for our full year 2026 revenue to now grow by above 30% in US dollar terms.……as you asking about how much higher than, you know, above 20% year-over-year's growth, we will share with you in July."}, {"topic": "2 奈米毛利稀釋", "period": "2026 全年", "value": "下半年開始稀釋，全年 2%–3%", "direction": "承壓", "vs_prior": "維持", "prior_value": "全年 2%–3%", "prior_quote": "Furthermore, the initial ramp up of our 2 nanometer technology will start to dilute our gross margin in the second half of the year, and we expect between 2 to 3 percentage percent dilution for the full year of 2026.", "quote": "As we have said before, the initial ramp-up of our 2-nanometer technology will start to dilute our gross margin in the second half of this year, and we expect between 2 and 3% dilution for the full year of 2026."}, {"topic": "N3 毛利率", "period": "2026 下半年", "value": "2026 下半年跨越公司平均毛利率", "direction": "改善", "vs_prior": "維持", "prior_value": "2026 年內跨越公司平均", "prior_quote": "N3 gross margin is expected to crossover to the corporate average sometime in 2026, and we continue to work hard to earn our value.", "quote": "Also, N3 gross margin is expected tocross over to the corporate average in second half 2026."}, {"topic": "海外廠毛利稀釋", "period": "未來數年", "value": "初期 2%–3%，後期擴大至 3%–4%", "direction": "承壓", "vs_prior": "維持", "prior_value": "初期 2%–3%、後期 3%–4%", "prior_quote": "we continue to forecast the gross margin dilution from the ramp up of overseas fabs in the next several years to be between 2 to 3% in the early stages and widen to 3 to 4% in the latter stages.", "quote": "Furthermore, as the scale of our overseas expansion grows, we continue to forecast the gross margin dilution from the ramp-up of overseas fabs in the next several years to be 2 to 3% in the early stages, and widen to 3 to 4% in the latter stages."}, {"topic": "中東情勢與原料成本", "period": "未提及", "value": "部分化學品與氣體可能漲價，影響暫不量化", "direction": "承壓", "vs_prior": "新增", "quote": "In addition, given the recent situation in the Middle East, prices for certain chemicals and gases are likely to increase. Based on our current assessment, there may be impact to our profitability, but it is too early to quantify the impact."}, {"topic": "資本預算", "period": "2026 全年", "value": "US$52–56 billion 區間高標（Q&A 口述 30–32 billion）", "direction": "成長", "vs_prior": "上修", "std": "capex", "low": 52, "high": 56, "unit": "US$ billion", "prior_value": "US$52–56 billion", "prior_quote": "In 2026, we expect our capital budget to be between 52 billion and 56 billion US dollars, as we continue to invest to support our customers' growth.", "quote": "We now expect our 2026 capital budget to be towards the high end of our range of between 52 and 56 billion US dollars, as we continue to invest heavily to support our customers' growth.……This year, we're already saying capex is towards the high end, which is 30 to 32 billion, which is already over 50% of the past three years in total."}, {"topic": "未來三年資本支出", "period": "未來三年", "value": "顯著高於過去三年的 US$101 billion（未給數字）", "direction": "成長", "vs_prior": "維持", "prior_value": "顯著高於過去三年的 US$101 billion", "prior_quote": "in the last three years, our CAPEX dollars amount total 101 billion US dollars, but is expected to be significantly higher in the next three years.", "quote": "In the past three years, our total capex was 101 billion.……So, we expect the capex in the next few years, in the next three years, will be significantly higher than the past three years."}, {"topic": "3 奈米全球擴產", "period": "2027–2028", "value": "南科 2027 上半年、美國二廠 2027 下半年、日本二廠 2028 量產", "direction": "成長", "vs_prior": "新增", "quote": "In Taiwan, we are adding a new 3-nanometer fab to our GigaFab cluster in Tainan Science Park. Volume production is scheduled for the first half of 2027.……In Arizona, our second fab will also utilize 3-nanometer technologies. Construction is already complete, and volume production will begin in the second half of 2027.……In Japan, we now plan to utilize 3-nanometer technologies in our second fab, and volume production is scheduled in 2028."}, {"topic": "A14 量產", "period": "2028", "value": "開發進度順利，2028 年量產", "direction": "成長", "vs_prior": "新增", "quote": "Our A14 technology development is on track and progressing well.We are observing a high level of customer interest and engagement from both smartphone and HPC applications. Volume production is scheduled for 2028."}, {"topic": "AI 加速器營收 CAGR", "period": "長期", "value": "朝五成多高段靠攏（原文 toward the high 50s）", "direction": "成長", "vs_prior": "上修", "std": "other", "prior_value": "約五成五至五成九（mid to high 50s，2024–2029）", "prior_quote": "we raise our forecast for the revenue growth from AI accelerator to approach a mid to high 50s percent CAGR for the five years period from 2024 to 2029.", "quote": "we continue to see strong demand, but, uh, again, let me say that is, uh, toward the high 50s of a CAGR that we observe."}, {"topic": "長期毛利率與 ROE", "period": "長期", "value": "毛利率 53% 以上、ROE high 20%（數字與前次不符，稱沿用）", "direction": "持平", "vs_prior": "維持", "std": "other", "prior_value": "毛利率 56% 以上、ROE high 20s", "prior_quote": "we believe a long-term gross margins of 56% and higher through the cycle is achievable, and we can earn an ROE of high 20s percent through the cycle.", "quote": "as we said in the last earning calls, we've revised up our long-term, uh, margin target and ROE targets, uh, from 2024 to 2029……we're now saying the gross margins will be 53% and higher through the cycle, and we're looking at ROE of high 20% through the cycle. That's what we're currently looking at, and that's already higher than before."}, {"topic": "消費性需求", "period": "未提及", "value": "零組件漲價衝擊消費性與價格敏感市場，審慎規劃", "direction": "承壓", "vs_prior": "維持", "prior_quote": "Entering 2026, we understand there are uncertainties and risk from the potential impact of tariff policies and rising component prices, especially in consumer-related and price-sensitive yet market segment.", "quote": "Looking ahead, we are very mindful of the impact of rising component prices, especially in consumer and price-sensitive end-market segment."}]}, "conclusion": {"text": "成長動能集中在AI與HPC，HPC季增20%、占營收61%，3奈米需求推動台美日擴產，先進封裝產能同樣吃緊。財務面現金及有價證券新台幣3.4兆元。主要變數是2奈米與海外廠稀釋毛利、中東情勢推升化學品與氣體價格、零組件漲價壓抑消費性需求。Q&A中長期資本支出、毛利結構與SoIC時程都未量化。"}, "rating": {"overall": "樂觀", "growth": {"score": 88, "reason": "全年成長與資本預算上修"}, "risk": {"score": 38, "reason": "毛利稀釋、中東原料、消費性"}}, "key_data": [{"metric": "營收", "period": "2026 Q1", "value": "US$35.9 billion", "change": "季增 6.4%", "std": "revenue", "num": 35.9, "unit": "US$ billion", "quote": "In US dollar terms, revenue increased 6.4% sequentially to 35.9 billion, slightly ahead of our first quarter guidance."}, {"metric": "毛利率", "period": "2026 Q1", "value": "66.2%", "change": "季增 3.9 個百分點", "std": "gross_margin", "num": 66.2, "unit": "%", "quote": "Gross margin increased 3.9 percentage points sequentially to 66.2%, primarily due to cost improvement efforts, a high capacity utilization rate, and a more favorable foreign exchange rate."}, {"metric": "營業利益率", "period": "2026 Q1", "value": "58.1%", "change": "季增 4.1 個百分點", "std": "op_margin", "num": 58.1, "unit": "%", "quote": "Operating margin improved 4.1 percentage points sequentially to 58.1% due to operating leverage."}, {"metric": "每股盈餘", "period": "2026 Q1", "value": "NT$22.08", "change": "—", "std": "eps", "num": 22.08, "unit": "NT$", "quote": "Overall, our first quarter EPS was 22.08 NT, and ROE was 40.5%."}, {"metric": "ROE", "period": "2026 Q1", "value": "40.5%", "change": "—", "std": "roe", "num": 40.5, "unit": "%", "quote": "Overall, our first quarter EPS was 22.08 NT, and ROE was 40.5%."}, {"metric": "本季資本支出", "period": "2026 Q1", "value": "US$11.1 billion", "change": "—", "std": "other", "num": 11.1, "unit": "US$ billion", "quote": "In US dollar terms, our first quarter capital expenditures total 11.1 billion."}, {"metric": "先進製程占晶圓營收", "period": "2026 Q1", "value": "74%（7 奈米以下）", "change": "—", "std": "other", "num": 74, "unit": "%", "quote": "Advanced technologies, defined as 7-nanometer and below, accounted for 74% of wafer revenue."}, {"metric": "3 奈米占晶圓營收", "period": "2026 Q1", "value": "25%", "change": "—", "std": "other", "num": 25, "unit": "%", "quote": "3-nanometer process technology contributed 25% of wafer revenue in the first quarter"}, {"metric": "HPC 營收占比", "period": "2026 Q1", "value": "61%", "change": "季增 20%", "std": "other", "num": 61, "unit": "%", "quote": "HPC increased 20% quarter-over-quarter to account for 61% of our first quarter revenue."}, {"metric": "智慧型手機營收占比", "period": "2026 Q1", "value": "26%", "change": "季減 11%", "std": "other", "num": 26, "unit": "%", "quote": "Smartphone decreased 11% to account for 26%."}, {"metric": "存貨天數", "period": "2026 Q1", "value": "80 天", "change": "增加 6 天（2 奈米爬坡、3 奈米需求強）", "std": "other", "num": 80, "unit": "天", "quote": "Days of inventory increased 6 days to 80 days, reflecting the ramp-up of our 2-nanometer technology and strong demand for our 3-nanometer technology."}, {"metric": "現金及有價證券", "period": "2026 Q1", "value": "NT$3.4 trillion（US$106 billion）", "change": "—", "std": "other", "num": 3.4, "unit": "NT$ trillion", "quote": "We ended the first quarter with cash and marketable securities of 3.4 trillion NT, or 106 billion US dollars."}], "tone": {"note": "兩段皆偏正向；講稿用may、likely保留，Q&A僅1次might。"}, "qa": [{"question": "3 奈米持續擴產，是哪些應用在推動需求？", "answer": "魏哲家說應用很單純，仍是 HPC 與 AI。", "stance": "正面", "asker": "外資", "asker_name": "Bruce Lu", "asker_org": "Goldman Sachs", "answerer": "董事長暨總裁", "quote": "I think the application is simple. It's still the HPC, AI applications.", "tag": "N3需求", "topic": "先進製程"}, {"question": "3 奈米毛利率何時跨越公司平均？折舊完後會更高嗎？", "answer": "下半年跨越公司平均，未給數字；折舊完畢後毛利率如同前幾代製程通常很高。", "stance": "正面", "asker": "外資", "asker_name": "Bruce Lu", "asker_org": "Goldman Sachs", "answerer": "資深副總經理暨財務長", "quote": "We expect the N3 gross margin to reach and cross the corporate gross margin level in the second half of this year. And we don't have a number to share with you, but after the full depreciation, as our previous nodes, the gross margins are generally very high.", "tag": "N3毛利", "topic": "毛利率"}, {"question": "資本支出改往區間高標，比三個月前多了什麼信心？", "answer": "HPC 與 AI 需求強勁，供給仍很吃緊，正盡力提前拉進設備，因此往高標靠攏。", "stance": "正面", "asker": "外資", "asker_name": "Bruce Lu", "asker_org": "Goldman Sachs", "answerer": "董事長暨總裁", "quote": "A simple, very simple answer is, the demand are very robust, especially from the HPC and AI applications. And also, we try very hard to speed it up and pull in all the equipment as we can. Still, our supply is very tight.", "tag": "資本支出", "topic": "資本支出"}, {"question": "供給吃緊會持續多久？2027 年能否供需平衡？", "answer": "建廠需二到三年，客戶展望非常正面，預期 2027 年仍會非常吃緊，正加速建無塵室與購置設備。", "stance": "正面", "asker": "外資", "asker_name": "Gokul Hariharan", "asker_org": "JPMorgan", "answerer": "董事長暨總裁", "quote": "it takes two to three years to build a new fab. And with the current schedule, we believe that 2027, we already announced it anyway when we enter 2027, but let me say that, it takes time to build a new fab, it takes time to ramp it up, and so we expect this continue to be very tight.", "tag": "供給吃緊", "topic": "產能與擴產"}, {"question": "如何看 Intel 與客戶自建晶圓廠的競爭？能否贏回客戶？", "answer": "Intel 是可敬對手，但晶圓代工沒有捷徑，需要技術、製造與客戶信任；對方仍是客戶，會爭取每一筆生意。", "stance": "防禦性", "asker": "外資", "asker_name": "Gokul Hariharan", "asker_org": "JPMorgan", "answerer": "董事長暨總裁", "quote": "we view Intel as a formidable competitor, and do not underestimate them. But having said that, there are no shortcuts. The fundamental rule of the foundry game never change.……And whether we try to win them back, actually they are still our customer, and we are very confident in our technology position.", "tag": "晶圓競爭", "topic": "競爭"}, {"question": "EMIB 等大尺寸封裝方案的競爭如何因應？會開放給他人封裝嗎？", "answer": "歡迎客戶有更多選擇；台積電供應最大光罩尺寸封裝，CoWoS-L 試產線已建置，預計數年後量產。", "stance": "正面", "asker": "外資", "asker_name": "Charlie Chan", "asker_org": "Morgan Stanley", "answerer": "董事長暨總裁", "quote": "today 台積電 is supplying the largest reticle size packaging. And yes, we understand that our competitor also offer very attractive technology. But we welcome that, so our customer can have more choices……So that's why we build a CoWoS-L pilot line right now, and expect production a couple of years later.", "tag": "封裝競爭", "topic": "先進封裝"}, {"question": "能否像 2021 年一樣給出未來三年資本支出金額？", "answer": "不給數字；過去三年資本支出 1,010 億美元，未來三年將顯著高於過去三年。", "stance": "正面", "asker": "外資", "asker_name": "Charlie Chan", "asker_org": "Morgan Stanley", "answerer": "資深副總經理暨財務長", "quote": "We, we don't have a number to share with you. But look at it this way. In the past three years, our total capex was 101 billion.……So, we expect the capex in the next few years, in the next three years, will be significantly higher than the past three years.", "tag": "長期資本支出", "topic": "資本支出"}, {"question": "設備交期長，是否擔心 EUV 等設備供應瓶頸？", "answer": "與 ASML、應材、科林等供應商視為夥伴持續合作，目前滿意其支援，其他不多談。", "stance": "避重就輕", "asker": "外資", "asker_name": "Charlie Chan", "asker_org": "Morgan Stanley", "answerer": "董事長暨總裁", "quote": "So, we continue to work with them, especially for those ASML, Applied Materials, Lam Research, etc. So, so far, we are very happy with their support. That's all I can tell you.", "tag": "設備供應", "topic": "產能與擴產"}, {"question": "未來營收成長與資本支出成長孰快？資本密集度會升高嗎？", "answer": "過去三年營收成長快於資本支出，未來數年也預期如此，資本密集度不會突然大幅升高。", "stance": "正面", "asker": "外資", "asker_name": "Sunny Lin", "asker_org": "UBS", "answerer": "資深副總經理暨財務長", "quote": "So, in the past three years, as you, as you correctly pointed out, the revenue growth outpaced the capex growth.……Now, therefore, we do not expect in the next several years a sudden surge in capital intensity.", "tag": "資本密集度", "topic": "資本支出"}, {"question": "是否會多投資本支出，避免客戶轉單分散？", "answer": "產能依客戶需求規劃，不是因為競爭對手或其他考量。", "stance": "防禦性", "asker": "外資", "asker_name": "Sunny Lin", "asker_org": "UBS", "answerer": "董事長暨總裁", "quote": "we repeatedly saying that we prepare the capacity to meet customer's demand, not because of our competitor or not because of other consideration.", "tag": "客戶分散", "topic": "競爭"}, {"question": "全年營收成長財測還有多少上修空間？", "answer": "不給新數字，表示 7 月再提供更精確的全年成長數字。", "stance": "避重就輕", "asker": "外資", "asker_name": "Sunny Lin", "asker_org": "UBS", "answerer": "董事長暨總裁", "quote": "And as you asking about how much higher than, you know, above 20% year-over-year's growth, we will share with you in July. How about that?", "tag": "全年財測", "topic": "需求展望"}, {"question": "記憶體漲價是否已影響手機與 PC 需求？", "answer": "記憶體漲價確實影響 PC 與手機等價格敏感市場，看到市場略為疲軟，但高階手機表現較好。", "stance": "保守", "asker": "外資", "asker_name": "Sunny Lin", "asker_org": "UBS", "answerer": "董事長暨總裁", "quote": "memory price hike definitely has some impact to price-sensitive end market, especially in PC and smartphone markets. But, we, we did see a little bit softer market, but, to share with you, all the high-end smartphone continue to do better.", "tag": "消費性需求", "topic": "需求展望"}, {"question": "需求強勁下，長期毛利結構與報酬率看法是否改變？", "answer": "長期毛利率 53% 以上、ROE high 20%（數字與上一場不同）；長期規劃持續檢視，有變動再更新。", "stance": "保守", "asker": "外資", "asker_name": "Jim Fontanelli", "asker_org": "Arete", "answerer": "資深副總經理暨財務長", "quote": "we're now saying the gross margins will be 53% and higher through the cycle, and we're looking at ROE of high 20% through the cycle.……the long-term planning, uh, is an ongoing and continuous process. So, we do that all the time, and we will update you when there is a, a change.", "tag": "長期毛利", "topic": "毛利率"}, {"question": "亞利桑那第二塊土地的規劃與美國廠獲利能力？", "answer": "需要土地才買，將在亞利桑那建更多廠以滿足美國客戶需求，比去年更有信心並將改善成本結構。", "stance": "正面", "asker": "外資", "asker_name": "Jim Fontanelli", "asker_org": "Arete", "answerer": "董事長暨總裁", "quote": "We acquired the second land because we need it. We want to build more, uh, fabs in Arizona.……we already, uh, get a lot of experience in Arizona, and so now we have much more confidence than last year", "tag": "美國廠", "topic": "海外布局"}, {"question": "目前獲利能力是否充分反映台積電價值？", "answer": "視客戶為夥伴，不會大幅調整價格，以客戶成功、共同成長並賺取應得價值為原則。", "stance": "保守", "asker": "外資", "asker_name": "Bruce Lu", "asker_org": "Goldman Sachs", "answerer": "董事長暨總裁", "quote": "we also view that our partner as a very important business, uh, partner, so that we don't, we don't change our pricing dramatically or something like that.", "tag": "定價策略", "topic": "價格"}, {"question": "token 用量加速，AI 加速器長期 CAGR 是否調整？", "answer": "持續收到客戶非常正面的訊號，AI 加速器營收複合成長率朝 high 50s 靠攏。", "stance": "正面", "asker": "外資", "asker_name": "Bruce Lu", "asker_org": "Goldman Sachs", "answerer": "董事長暨總裁", "quote": "Uh, we continue to see strong demand, but, uh, again, let me say that is, uh, toward the high 50s of a CAGR that we observe.", "tag": "AI加速器", "topic": "AI需求"}, {"question": "先進封裝如何與客戶規劃產能、與 OSAT 合作？", "answer": "先進封裝產能同樣非常吃緊，會與 OSAT 夥伴合作，也努力擴充自有產能支援客戶。", "stance": "正面", "asker": "法人", "asker_name": "Laura Chen", "asker_org": "逐字稿未提及", "answerer": "董事長暨總裁", "quote": "let me say that our advanced packaging capacity is very tight also. So we have to, uh, work with our OSAT partners.", "tag": "封裝產能", "topic": "先進封裝"}, {"question": "超大晶片的翹曲等技術挑戰，SoIC、CoWoS 能否解決？", "answer": "已累積大量經驗，持續克服機械應力、翹曲與散熱限制，有信心與客戶一起解決。", "stance": "防禦性", "asker": "法人", "asker_name": "Laura Chen", "asker_org": "逐字稿未提及", "answerer": "董事長暨總裁", "quote": "However, we accumulated a lot of experience already today because we have supplied most of the leading edge or in the packaging area.", "tag": "封裝技術", "topic": "先進封裝"}, {"question": "SoIC 是否會提早導入以解決這些挑戰？", "answer": "只表示配合客戶需求，不談加速或放慢。", "stance": "避重就輕", "asker": "法人", "asker_name": "Laura Chen", "asker_org": "逐字稿未提及", "answerer": "董事長暨總裁", "quote": "Well, we work with our customer, and we meet their demand. And that's all I can tell you.", "tag": "SoIC", "topic": "先進封裝"}, {"question": "AI 營收定義是否納入資料中心 CPU？", "answer": "無法分辨 CPU 用於 PC 或 AI 資料中心，目前仍不納入，之後可能考慮。", "stance": "保守", "asker": "外資", "asker_name": "Charles Shi", "asker_org": "Needham", "answerer": "董事長暨總裁", "quote": "Let me share with you that we are not able to identify which CPU goes to where, right? Is it PC or desktop, or is it AI data center? So today, we still not include the CPUs in our AI HPC's calculation. Sometime later, we might consider.", "tag": "AI定義", "topic": "AI需求"}, {"question": "LPU 由 Samsung 代工，台積電如何贏回推論業務？", "answer": "正與客戶合作下一代 LPU，對技術地位很有信心，會爭取每一筆生意。", "stance": "防禦性", "asker": "外資", "asker_name": "Charles Shi", "asker_org": "Needham", "answerer": "董事長暨總裁", "quote": "We are working with our customer for their next generations of LPU anyway. And we are very confident in our technology position. And we will work hard to capture every piece of business possible.", "tag": "LPU", "topic": "競爭"}], "attendees": [{"name": "魏哲家", "title": "董事長暨總裁", "sections": "簡報、Q&A"}, {"name": "黃仁昭", "title": "資深副總經理暨財務長", "sections": "簡報、Q&A"}, {"name": "蘇志凱", "title": "法人關係處處長（主持）", "sections": "開場、Q&A 主持與轉述"}], "analysts": [{"name": "Bruce Lu", "org": "Goldman Sachs", "type": "外資", "questions": 5}, {"name": "Gokul Hariharan", "org": "JPMorgan", "type": "外資", "questions": 2}, {"name": "Charlie Chan", "org": "Morgan Stanley", "type": "外資", "questions": 3}, {"name": "Sunny Lin", "org": "UBS", "type": "外資", "questions": 4}, {"name": "Jim Fontanelli", "org": "Arete", "type": "外資", "questions": 2}, {"name": "Laura Chen", "org": "逐字稿未提及", "type": "未提及", "questions": 3}, {"name": "Charles Shi", "org": "Needham", "type": "外資", "questions": 2}], "voices": [{"role": "CEO", "name": "魏哲家", "title": "董事長暨總裁", "focus": "展望", "points": [{"text": "AI 需求極為強勁，代理式 AI 推升 token 用量", "quote": "Having said that, AI-related demand continued to be extremely robust. The shift from generative AI and the query mode to agentic AI and command and action mode is leading to another step-up in the amount of token being consumed."}, {"text": "有信心 2026 全年美元營收成長 30% 以上", "quote": "we maintain strong confidence for our full year 2026 revenue to now grow by above 30% in US dollar terms."}, {"text": "台、美、日新增 3 奈米產能，2027 至 2028 年陸續量產", "quote": "In Taiwan, we are adding a new 3-nanometer fab to our GigaFab cluster in Tainan Science Park. Volume production is scheduled for the first half of 2027.……In Japan, we now plan to utilize 3-nanometer technologies in our second fab, and volume production is scheduled in 2028."}, {"text": "零組件漲價衝擊消費性市場，中東情勢增添不確定性", "quote": "Looking ahead, we are very mindful of the impact of rising component prices, especially in consumer and price-sensitive end-market segment.……the recent situation in the Middle East also bring further macroeconomic uncertainties."}, {"text": "A14 開發進度順利，預計 2028 年量產", "quote": "Our A14 technology development is on track and progressing well.……Volume production is scheduled for 2028."}]}, {"role": "CFO", "name": "黃仁昭", "title": "資深副總經理暨財務長", "focus": "財務", "points": [{"text": "第一季毛利率 66.2%，超出財測高標 120 個基點", "quote": "our first quarter gross margin increased by 390 basis points sequentially to 66.2%……our actual gross margin exceeded the high end of the range provided three months ago by 120 basis points"}, {"text": "第二季營收財測 US$39.0–40.2 billion，中值季增 10%", "quote": "we expect our second quarter revenue to be between 39.0 billion and 40.2 billion US dollars, which represents a 10% sequential increase"}, {"text": "2 奈米爬坡將稀釋 2026 全年毛利率 2%–3%", "quote": "the initial ramp-up of our 2-nanometer technology will start to dilute our gross margin in the second half of this year, and we expect between 2 and 3% dilution for the full year of 2026."}, {"text": "中東情勢恐推升化學品與氣體價格，影響尚難量化", "quote": "given the recent situation in the Middle East, prices for certain chemicals and gases are likely to increase. Based on our current assessment, there may be impact to our profitability, but it is too early to quantify the impact."}, {"text": "2026 資本預算將落在 US$52–56 billion 區間高標", "quote": "We now expect our 2026 capital budget to be towards the high end of our range of between 52 and 56 billion US dollars"}]}], "keywords": [{"word": "AI", "type": "positive", "count": 34}, {"word": "3-nanometer", "type": "positive", "count": 10}, {"word": "HPC", "type": "positive", "count": 8}, {"word": "CoWoS", "type": "positive", "count": 8}, {"word": "N2", "type": "positive", "count": 6}, {"word": "A14", "type": "positive", "count": 6}, {"word": "Arizona", "type": "positive", "count": 4}, {"word": "tight", "type": "risk", "count": 11}, {"word": "Middle East", "type": "risk", "count": 4}, {"word": "competitor", "type": "risk", "count": 4}, {"word": "dilution", "type": "risk", "count": 3}, {"word": "memory price", "type": "risk", "count": 1}], "briefs": {"line": "幫大家同步一下台積電 4/16 法說會的重點：\n1. Q1 營收 359 億美元，季增 6.4%，略高於財測；毛利率 66.2%，超出財測高標。\n2. Q2 營收指引 390–402 億美元（中值季增 10%），毛利率 65.5–67.5%。\n3. 全年美元營收成長從接近 30% 上修到 30% 以上；資本預算往 520–560 億美元高標靠攏。\n4. 管理層說 AI 需求極為強勁，台、美、日擴建 3 奈米產能，2027 年仍會很吃緊。\n5. 變數：零組件漲價衝擊消費性市場，中東情勢恐推升化學品與氣體成本。", "memo": "【台積電 2026 Q1 法說會摘要】\n整體來看，AI 需求帶動第一季營收與毛利率都高於財測，全年美元營收成長與資本預算同步上修。要留意 2 奈米與海外廠稀釋毛利、中東情勢對化學品與氣體成本的影響，以及 Q&A 幾個數字和講稿不一致。\n\n重點：\n1. 本季：營收 359 億美元，季增 6.4%；毛利率 66.2%、營益率 58.1%；EPS 新台幣 22.08 元。\n2. 指引：Q2 營收 390–402 億美元，毛利率 65.5%–67.5%，營益率 56.5%–58.5%。\n3. 上修：全年美元營收成長由接近 30% 上修至 30% 以上；資本預算往 520–560 億美元區間高標靠攏；AI 加速器營收複合成長率朝 high 50s 靠攏。\n4. Q&A：21 題中，長期資本支出、毛利結構、SoIC 時程都沒有給數字；管理層說產能吃緊延續到 2027 年。\n5. 待確認：Q&A 中全年成長說成 20% 以上、資本支出說成 300–320 億美元、長期毛利率 53% 以上，與講稿或上一場（56% 以上）不一致。", "report": "台積電 2026 Q1 法說會重點（2026/4/16）\n\n結論：AI 需求帶動 Q1 毛利率超出財測高標，全年營收成長、資本預算與 AI 加速器長期成長同步上修；主要變數是 2 奈米與海外廠稀釋毛利，以及中東情勢帶來的原料成本。\ /* 評價儀表：指針跟著滑鼠走，放開後用彈簧回到實際評價 */
function buildDial(){
  const R=D.rating||{}, idx=Math.max(0,RATINGS.indexOf(R.overall)), NS='http://www.w3.org/2000/svg';
  const W=420,H=250,cx=210,cy=215,r1=120,r2=176;
  const s=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg=s('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':`整體評價：${R.overall||''}`});
  const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const segs=[];
  for(let i=0;i<5;i++){
    const a0=-90+i*36+1.2,a1=-90+(i+1)*36-1.2;
    const [x0,y0]=pt(a0,r2),[x1,y1]=pt(a1,r2),[x2,y2]=pt(a1,r1),[x3,y3]=pt(a0,r1);
    const p=s('path',{class:'seg',d:`M${x0},${y0} A${r2},${r2} 0 0 1 ${x1},${y1} L${x2},${y2} A${r1},${r1} 0 0 0 ${x3},${y3}Z`,fill:'#1d3a66'});
    svg.append(p); segs.push(p);
    const [lx,ly]=pt(-90+(i+.5)*36,r2+20);
    const t=s('text',{x:lx,y:ly,'text-anchor':'middle','dominant-baseline':'middle','font-size':'13','font-weight':i===idx?'700':'500',fill:i===idx?'#ffffff':'#9fb4cf'}); t.textContent=RATINGS[i]; svg.append(t);
  }
  for(let k=0;k<=30;k++){const d=-90+k*6,[a,b]=pt(d,r1-6),[c,e]=pt(d,r1-(k%5?12:18));svg.append(s('line',{x1:a,y1:b,x2:c,y2:e,stroke:'#9fb4cf','stroke-width':k%5?1:1.6,opacity:.6}));}
  const needle=s('g',{});
  needle.append(s('path',{d:`M${cx-7},${cy} L${cx},${cy-r2+10} L${cx+7},${cy}Z`,fill:'#ffffff'}));
  needle.append(s('circle',{cx,cy,r:14,fill:'#1970b8',stroke:'#ffffff','stroke-width':3}));
  svg.append(needle);
  const target=-90+(idx+.5)*36;
  let ang=-90, vel=0, goal=target, dragging=false, hovering=false, raf=0;
  const lbl=h('strong',{text:R.overall||''}), hint=h('div',{class:'dial-hint',text:'把滑鼠移到儀表上，看每一級代表什麼'});
  const items0=(D.outlook||{}).items||[], up0=items0.filter(i=>i.vs_prior==='上修').length, dn0=items0.filter(i=>i.vs_prior==='下修').length, ts0=(D.tone_scores||{}).presentation;
  const basis=[items0.some(i=>i.vs_prior)?`指引上修 ${up0} 項、下修 ${dn0} 項`:null, ts0?`講稿語調 ${fmtScore(ts0.score)}`:null].filter(Boolean).join('，');
  const desc=h('div',{class:'dial-desc'}); const how=h('button',{class:'linkish',type:'button',text:'怎麼評的'}); how.addEventListener('click',()=>openDrawer('method'));
  let shown=-2;
  function setDesc(i){ if(i===shown) return; shown=i;
    if(i<0){ desc.replaceChildren(basis?`依據：${basis}。`:'',h('small',{},LEVEL_DEF[R.overall]||'')); }
    else desc.replaceChildren(h('b',{text:RATINGS[i]+'：'}),LEVEL_DEF[RATINGS[i]]); }
  function paint(){ needle.setAttribute('transform',`rotate(${ang} ${cx} ${cy})`);
    const cur=Math.min(4,Math.max(0,Math.floor((ang+90)/36)));
    segs.forEach((p,i)=>p.setAttribute('fill', i===idx?'#1970b8':(i===cur&&(hovering||dragging)?'#2f5c96':'#1d3a66')));
    lbl.textContent=(hovering||dragging)?RATINGS[cur]:(R.overall||''); lbl.style.opacity=(hovering||dragging)&&cur!==idx?.55:1; setDesc((hovering||dragging)?cur:-1); }
  function tick(){ const k=(hovering||dragging)?.12:.075, c=(hovering||dragging)?.72:.86;  // 放開後較軟，會晃一下
    vel=(vel+(goal-ang)*k)*c; ang+=vel; paint();
    if(Math.abs(vel)>.01||Math.abs(goal-ang)>.05) raf=requestAnimationFrame(tick); else {ang=goal;paint();raf=0;} }
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(tick); };
  function aim(e){ const b=svg.getBoundingClientRect(), x=(e.clientX-b.left)*W/b.width-cx, y=(e.clientY-b.top)*H/b.height-cy;
    let d=Math.atan2(x,-y)*180/Math.PI; goal=Math.max(-88,Math.min(88,d)); kick(); }
  svg.addEventListener('pointerenter',e=>{hovering=e.pointerType==='mouse';if(hovering)aim(e);});
  svg.addEventListener('pointermove',e=>{if(hovering||dragging)aim(e);});
  svg.addEventListener('pointerdown',e=>{dragging=true;svg.setPointerCapture(e.pointerId);aim(e);});
  const release=()=>{dragging=false;hovering=false;goal=target;vel+= (target>ang?-6:6);kick();};
  svg.addEventListener('pointerup',release); svg.addEventListener('pointerleave',()=>{if(!dragging)release();}); svg.addEventListener('pointercancel',release);
  if(RM){ang=target;paint();} else { paint(); setTimeout(()=>{vel=4;kick();},450); }
  setDesc(-1);
  const box=h('div',{class:'dial-box rv'},svg,h('div',{class:'dial-label'},h('small',{text:'整體評價'}),lbl),desc,h('div',{class:'dial-hint'},hint.textContent+'　',how));
  requestAnimationFrame(()=>box.classList.add('in'));
  return box;
}

/* 關鍵字：會掉下來、可以抓起來丟的球。球的大小依出現次數 */
function buildPit(){
  const K=(D.keywords||[]).filter(k=>k.count>0);
  const pit=h('div',{class:'pit',role:'list','aria-label':'關鍵字與出現次數'});
  const maxC=Math.max(1,...K.map(k=>k.count));
  const balls=K.map(k=>{ const r=Math.round(34+40*Math.sqrt(k.count/maxC));
    const el=h('div',{class:'ball '+(k.type==='risk'?'risk':'pos'),role:'listitem',style:`width:${r*2}px;height:${r*2}px;font-size:${Math.max(12,Math.min(18,r/3.3))}px`},
      h('span',{'data-s':'1',text:k.word}),h('small',{class:'num',text:k.count+' 次'}));
    pit.append(el); return {el,r,x:0,y:0,vx:0,vy:0,drag:false}; });
  const legend=h('div',{class:'pit-legend'},h('span',{},h('i'),'正面議題'),h('span',{},h('i',{class:'r'}),'風險議題'),h('span',{text:'球越大，出現次數越多；可以拖曳、丟出去'}));
  const reset=h('button',{class:'pit-reset',type:'button',text:'重新落下'}); legend.append(reset);
  const wrap=h('div',{},pit,legend);
  let W=0,H=0,running=false,visible=false,last=0;
  const place=(b)=>{b.el.style.transform=`translate3d(${b.x-b.r}px,${b.y-b.r}px,0)`;};
  function drop(){ W=pit.clientWidth;H=pit.clientHeight; balls.forEach((b,i)=>{b.x=b.r+Math.random()*(W-2*b.r); b.y=-b.r-i*70-Math.random()*40; b.vx=(Math.random()-.5)*4; b.vy=0; place(b);}); }
  function staticLayout(){ // 減少動態：直接排好
    W=pit.clientWidth;H=pit.clientHeight; let x=8,y=H-8,row=0;
    [...balls].sort((a,b)=>b.r-a.r).forEach(b=>{ if(x+2*b.r>W-8){x=8;y-=row*2+6;row=0;} b.x=x+b.r;b.y=y-b.r;x+=2*b.r+6;row=Math.max(row,b.r);place(b);}); }
  function step(t){
    const dt=Math.min(2,(t-last)/16.7||1); last=t;
    for(const b of balls){ if(b.drag) continue; b.vy+=.55*dt; b.vx*=.995; b.vy*=.995; b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.x<b.r){b.x=b.r;b.vx=-b.vx*.6;} if(b.x>W-b.r){b.x=W-b.r;b.vx=-b.vx*.6;}
      if(b.y>H-b.r){b.y=H-b.r;b.vy=-b.vy*.45;b.vx*=.92; if(Math.abs(b.vy)<.6)b.vy=0;} }
    for(let it=0;it<3;it++) for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,m=a.r+b.r;
      if(d<m){ const o=(m-d)/2,nx=dx/d,ny=dy/d, ma=a.drag?0:1, mb=b.drag?0:1, s=ma+mb||1;
        a.x-=nx*o*2*ma/s; a.y-=ny*o*2*ma/s; b.x+=nx*o*2*mb/s; b.y+=ny*o*2*mb/s;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(rv<0){ const imp=-rv*.8; if(ma){a.vx-=imp*nx*.5;a.vy-=imp*ny*.5;} if(mb){b.vx+=imp*nx*.5;b.vy+=imp*ny*.5;} } } }
    balls.forEach(place);
    if(visible) requestAnimationFrame(step); else running=false;
  }
  const go=()=>{ if(!running&&visible){running=true;last=performance.now();requestAnimationFrame(step);} };
  // 拖曳：記錄最近的移動速度，放開時丟出去
  balls.forEach(b=>{ let px=0,py=0,pt=0;
    b.el.addEventListener('pointerdown',e=>{ b.drag=true; b.el.setPointerCapture(e.pointerId); const r=pit.getBoundingClientRect(); px=e.clientX-r.left; py=e.clientY-r.top; pt=performance.now(); b.vx=b.vy=0; });
    b.el.addEventListener('pointermove',e=>{ if(!b.drag) return; const r=pit.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now(),dt=Math.max(8,now-pt)/16.7;
      b.vx=(x-px)/dt; b.vy=(y-py)/dt; b.x=Math.max(b.r,Math.min(W-b.r,x)); b.y=Math.max(b.r,Math.min(H-b.r,y)); px=x;py=y;pt=now; if(RM)place(b); });
    const up=()=>{ if(!b.drag) return; b.drag=false; b.vx=Math.max(-40,Math.min(40,b.vx)); b.vy=Math.max(-40,Math.min(40,b.vy)); };
    b.el.addEventListener('pointerup',up); b.el.addEventListener('pointercancel',up); });
  // 滑鼠劃過會把球撥開
  pit.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse'||RM) return; const r=pit.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    balls.forEach(b=>{ if(b.drag) return; const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy); if(d<b.r+30&&d>0){ const f=(b.r+30-d)/(b.r+30)*1.6; b.vx+=dx/d*f; b.vy+=dy/d*f-.3; } }); });
  reset.addEventListener('click',()=>{ if(RM){staticLayout();return;} drop(); go(); });
  if('IntersectionObserver' in window){ let first=true; new IntersectionObserver(es=>es.forEach(x=>{ visible=x.isIntersecting; if(visible){ if(first){first=false; if(RM)staticLayout(); else drop();} if(!RM) go(); } }),{threshold:.25}).observe(pit); }
  addEventListener('resize',()=>{ const w=pit.clientWidth; if(w&&w!==W){W=w;H=pit.clientHeight; if(RM)staticLayout();} });
  return wrap;
}

secs.forEach(s=>{ const SHORT={'結論與投資評價':'結論評價','出席人員與關鍵字':'關鍵字','出席人員組成':'出席人員','QA 關注議題':'Q&A'};
  const a=h('a',{href:'#'+s.id,text:s.id==='s-summary'?'摘要':(SHORT[s.dataset.title]||s.dataset.title)}); a.addEventListener('click',e=>{e.preventDefault();go(s);}); toc.append(a); });
function go(el){ const y=el.getBoundingClientRect().top+scrollY-(el.classList.contains('hero')?0:($('header').getBoundingClientRect().bottom)+(el.matches('section.dark')?-20:8)); scrollTo({top:Math.max(0,y),behavior:RM?'auto':'smooth'}); }
const prog=$('#prog'), toTop=$('#toTop');
function onScroll(){ const max=document.documentElement.scrollHeight-innerHeight; prog.style.transform=`scaleX(${max>0?scrollY/max:0})`;
  toTop.classList.toggle('show',scrollY>innerHeight*.8);
  let cur=0; secs.forEach((s,i)=>{ if(s.getBoundingClientRect().top<innerHeight*.35) cur=i; });
  $$('a',toc).forEach((a,i)=>a.classList.toggle('on',i===cur)); }
addEventListener('scroll',onScroll,{passive:true}); onScroll();
toTop.addEventListener('click',()=>scrollTo({top:0,behavior:RM?'auto':'smooth'}));

/* 搜尋：標黃、上一筆／下一筆；命中在翻面卡、收合的 QA、橫向卡片裡也找得到 */
const q=$('#q'), hits=$('#hits'), hitTxt=$('#hitTxt'); let marks=[], cur=-1;
function clearMarks(){ $$('mark').forEach(m=>{const p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();}); marks=[];cur=-1; }
function search(term){
  clearMarks(); term=term.trim(); if(!term){hits.classList.remove('show');return;}
  const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  $$('[data-s]').forEach(el=>{ const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); const ns=[]; while(w.nextNode()) ns.push(w.currentNode);
    ns.forEach(n=>{ const t=n.nodeValue; if(!re.test(t)) return; re.lastIndex=0; const f=document.createDocumentFragment(); let l=0,m;
      while((m=re.exec(t))){ f.append(t.slice(l,m.index)); const mk=document.createElement('mark'); mk.textContent=m[0]; f.append(mk); marks.push(mk); l=m.index+m[0].length; }
      f.append(t.slice(l)); n.parentNode.replaceChild(f,n); }); });
  hits.classList.add('show'); if(!marks.length){hitTxt.textContent='沒有符合的原文';return;} show(0);
}
function show(i){ if(!marks.length) return; cur=(i+marks.length)%marks.length; marks.forEach((m,j)=>m.classList.toggle('cur',j===cur));
  hitTxt.textContent=`${cur+1}／${marks.length}`; const m=marks[cur];
  const qi=m.closest('.qitem'); if(qi){ qi.classList.remove('hide'); if(!qi.classList.contains('open')) qi.querySelector('.qbtn').click(); }
  const kc=m.closest('.kcard'); if(kc){ const back=!!m.closest('.back'); kc.classList.toggle('flip',back); }
  const gc=m.closest('.gcard'), H=window.__hs;
  if(gc&&H&&!H.isStatic()){ // 換算成直向捲動位置，讓那張卡滑到畫面裡
    const p=Math.min(1,Math.max(0,(gc.offsetLeft-innerWidth*.25)/Math.max(1,H.maxX)));
    const top=H.hs.getBoundingClientRect().top+scrollY+p*(H.hs.offsetHeight-H.sticky.offsetHeight);
    scrollTo({top,behavior:RM?'auto':'smooth'}); return; }
  if(gc&&H&&H.isStatic()) H.track.scrollTo({left:gc.offsetLeft-20,behavior:RM?'auto':'smooth'});
  setTimeout(()=>{ const r=m.getBoundingClientRect(); scrollTo({top:r.top+scrollY-innerHeight/2,behavior:RM?'auto':'smooth'}); },qi?380:0);
}
let st; q.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>search(q.value),250);});
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); if(marks.length) show(cur+(e.shiftKey?-1:1)); else search(q.value);} if(e.key==='Escape'){q.value='';search('');} });
$('#prev').addEventListener('click',()=>show(cur-1)); $('#next').addEventListener('click',()=>show(cur+1));
addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();} });
})();
/* ec-site-nav */(function(){var b=document.querySelector('a.brand');if(!b)return;var t='回法說會大平台首頁';
if(window.top!==window){b.title=t;b.addEventListener('click',function(e){e.preventDefault();try{parent.postMessage({ec:'home'},'*');}catch(x){}});}
else if(/\/data\/[^\/]+\.html$/.test(decodeURIComponent(location.pathname))){b.href='../index.html';b.title=t;}})();
</script>
</body>
</html>
