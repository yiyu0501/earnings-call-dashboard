th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--tint);font-size:12.5px;color:var(--navy);white-space:nowrap}
td.t{font-weight:700;color:var(--link);white-space:nowrap}
tr:last-child td{border-bottom:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.scard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:8px}
.scard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.scard .top b{font-size:17px}
.scard p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.scard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13.5px}.scard dt{color:var(--grey)}.scard dd{margin:0}
.openbtn{align-self:flex-start;margin-top:auto;border:0;background:var(--grad);color:#fff;border-radius:999px;height:36px;padding:0 16px;font-weight:700;font-size:14px}
.chart{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--grey);margin-top:6px}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.sbox{display:flex;gap:8px;margin:6px 0 10px}
.sbox input{flex:1;height:50px;border:1px solid var(--line);border-radius:999px;padding:0 20px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sbox input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.try{font-size:13.5px;color:var(--grey);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.try button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:28px;padding:0 12px;font-size:13px}
.res{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-top:12px}
.res-h{display:flex;gap:10px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.res-h b{font-size:16px}.res-h span{font-size:13px;color:var(--grey)}
.res-h button{margin-left:auto;border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:999px;height:30px;padding:0 12px;font-size:13px;font-weight:700}
.hit{padding:10px 16px;border-bottom:1px dashed var(--line);font-size:14.5px}.hit:last-child{border-bottom:0}
.hit i{font-style:normal;font-size:12px;font-weight:700;color:var(--primary);margin-right:8px}
.about p,.about li{font-size:15.5px}
.fcount[hidden]{display:none}.fcount{font-style:normal;display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--primary);color:#fff;font-size:11.5px;font-weight:800;vertical-align:1px}
.hit.go{cursor:pointer;position:relative;padding-right:110px}.hit.go:hover{background:var(--tint)}.hit .hgo{position:absolute;right:16px;top:10px;font-size:12.5px;font-weight:700;color:var(--primary);opacity:0;transition:opacity .15s}.hit.go:hover .hgo,.hit.go:focus-visible .hgo{opacity:1}
@media (pointer:coarse){.hit.go{padding-right:16px}.hit .hgo{position:static;display:block;opacity:1;margin-top:4px}}
.cojump{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 8px;font-size:14px}.cojump a{cursor:pointer;font-weight:700;color:var(--link,var(--primary))}
h2 .cnt{font-size:14px;color:var(--grey);font-weight:700}
.colist{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px}
.cohead,.corow{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(150px,1fr) minmax(170px,1.2fr) 60px;gap:12px;align-items:center;padding:0 16px}
.cohead{font-size:12.5px;color:var(--grey);font-weight:700;height:36px;border-bottom:1px solid var(--line);padding-right:56px}
.corow-w{display:flex;align-items:center;border-bottom:1px solid var(--line)}.corow-w:last-child{border-bottom:0}.corow-w .star{margin-right:12px}
.corow{flex:1;min-height:54px;text-decoration:none;color:var(--ink)}.corow:hover{background:var(--tint)}.corow .cn b{font-size:16px;margin-right:8px}.corow .cn .num,.corow .cl .num{color:var(--grey);font-size:13px}
.corow .cl{display:flex;gap:8px;font-size:14px}.corow .cr{display:flex;gap:8px;align-items:center;font-size:13.5px}.corow .cs{color:var(--grey);font-size:13px;text-align:right}
@media (max-width:640px){.cohead{display:none}.corow{grid-template-columns:1fr auto;padding:10px 12px;gap:4px 10px}.corow .cl{grid-column:1}.corow .cr{grid-column:2;grid-row:1/3;justify-content:flex-end;flex-wrap:wrap}.corow .cs{display:none}}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:8px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:8px;align-content:start}
.wt{display:flex;align-items:center;gap:8px}.wt b{font-size:18px}.wt .num{color:var(--grey);font-size:13px}.wt .sp{margin-left:auto}
.wl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}.wl .wq{font-weight:700}.wl.muted{color:var(--grey)}
.ws{margin:0;font-size:14px;line-height:1.7;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wd{display:flex;gap:18px;font-size:13.5px;color:var(--grey)}.wd b{color:var(--ink)}
.wacts{display:flex;align-items:center;gap:12px;margin-top:4px}.btn.sm{height:36px;padding:0 16px;font-size:14px}.wlink{font-weight:700;font-size:14px}
.wempty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px 22px;max-width:760px}.wempty p{margin:0 0 12px}
.wsug{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}.wsugi{display:inline-flex;align-items:center;gap:4px}.wsugi a{font-weight:700}
.rchips{margin:10px 0 4px;align-items:center}.rchips .cl{font-size:13px;font-weight:700;color:var(--grey);margin-right:4px}
.rchips .fchip.up[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:#fff}.rchips .fchip.down[aria-pressed="true"]{background:var(--down);border-color:var(--down);color:#fff}
.peers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:10px 0 8px}
.peer{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.peer:hover,.peer:focus-visible{transform:translateY(-2px);border-color:var(--primary)}.peer .pt{display:flex;align-items:baseline;gap:8px}.peer .pt b{font-size:17px}.peer .pt .num{color:var(--grey);font-size:13px}
.peer .pm{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--grey)}.peer .pr{display:flex;gap:10px;font-size:13.5px;min-height:20px}.peer .pz{color:var(--grey)}
.snav{display:inline-flex;align-items:center;gap:6px;margin-left:6px;flex-wrap:wrap}.fbar button[disabled]{opacity:.4;cursor:default}
.peersel{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:0 10px;max-width:220px}
.qhelp{cursor:pointer;font-size:13px;font-weight:700;margin-left:8px;color:var(--link,var(--primary));text-decoration:underline dotted;text-underline-offset:3px}
h2 .qhelp{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);text-decoration:none;font-size:12px;vertical-align:middle;margin-left:8px}
.kbd-tip{font-size:13px;color:var(--grey);margin-top:22px}kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-family:ui-monospace,monospace;font-size:12.5px;background:var(--surface)}
.newbie{display:inline-flex;align-items:center;gap:10px;margin:14px auto 0;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);font-size:14.5px}
.newbie b{color:var(--primary)}.newbie i{font-style:normal;color:var(--primary);font-weight:700;transition:transform .15s}.newbie:hover i{transform:translateX(3px)}
.gstarts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:8px 0 10px;max-width:none}
.gstart{display:grid;gap:4px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.gstart:hover,.gstart:focus-visible{transform:translateY(-2px);border-color:var(--primary)}.gstart em{font-style:normal;color:var(--primary);font-weight:900;font-size:13px}.gstart b{font-size:16.5px}.gstart span{color:var(--grey);font-size:14px;line-height:1.6}
.gsteps{padding-left:22px;display:grid;gap:10px}.gsteps li{line-height:1.75}.gsteps b{display:block;font-size:16px}.gsteps span{color:var(--ink)}
.gloss{display:grid;grid-template-columns:150px 1fr;gap:0;border-top:1px solid var(--line);max-width:860px}
.gloss dt,.gloss dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.75}.gloss dt{font-weight:800;padding-right:16px}.gloss dd{color:var(--ink)}
.gloss dt.ghit,.gloss dt.ghit+dd{background:var(--tint)}
@media (max-width:640px){.gloss{grid-template-columns:1fr}.gloss dt{border-bottom:0;padding-bottom:0}}
@media (max-width:640px){.ltools{flex-direction:column;align-items:stretch;min-width:0;max-width:100%}.ltools .chips{min-width:0;max-width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.ltools .chips::-webkit-scrollbar{display:none}.ltools .chips .fchip{flex-shrink:0}.ltools .sort{align-self:flex-start}}
@media (pointer:coarse){.fchip,.nb,.star,.fb-types button,.try button{min-height:40px}.fbar button,.peersel{height:36px}.fl a{display:inline-block;padding:8px 2px}.crumb a{display:inline-block;padding:6px 0}}
.fb-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);max-width:760px;display:grid;gap:16px;margin:8px 0 28px}
.fb-row{display:grid;gap:6px}.fb-row>span{font-weight:700;font-size:14px}.fb-row em{font-style:normal;font-weight:400;color:var(--grey);font-size:12.5px;margin-left:8px}
.fb-row input,.fb-row textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.fb-row textarea{resize:vertical;min-height:120px}
.fb-types{display:flex;flex-wrap:wrap;gap:8px}.fb-types button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;height:34px;padding:0 14px;font:inherit;font-size:14px;cursor:pointer}
.fb-types button[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.fb-acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.fb-alt{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.fb-tip{margin:0;color:var(--primary);font-size:14px;min-height:1em}.fb-note{margin:0;color:var(--grey);font-size:13px}
.fb ul{max-width:760px}
.nf-go{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:8px 0 40px}.nf-l{font-weight:700;color:var(--link)}.about p,.about ul,.about .box{max-width:820px}
.about ul{padding-left:22px}
.box{background:var(--tint);border-left:4px solid var(--primary);border-radius:10px;padding:14px 16px;margin:12px 0}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:13px;color:var(--grey)}
.frame{position:absolute;inset:0;display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);font-size:14px;flex-shrink:0;flex-wrap:wrap}
.fbar a{cursor:pointer;text-decoration:none}.fbar .sp{margin-left:auto;display:flex;gap:6px}
.fbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:30px;padding:0 12px;font-size:13px;font-weight:700}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
/* 行事曆 */
.cal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-h>b{font-size:17px;min-width:150px;text-align:center}
.cal-h .sp{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-right:6px}
.seg button{border:0;background:var(--surface);height:30px;padding:0 16px;font-size:13.5px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--grad);color:#fff}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mg .wd{font-size:12px;color:var(--grey);font-weight:700;text-align:center}
.dc{min-height:80px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface)}
.dc.out{background:var(--bg);opacity:.55}
.dc.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.dc .d{font-weight:700;color:var(--grey)}.dc.today .d{color:var(--teal)}
.ev{border:0;text-align:left;background:var(--grad);color:#fff;border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev:hover{filter:brightness(1.1)}
.wg{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:6px}
.wcol{border:1px solid var(--line);border-radius:10px;min-height:160px;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;min-width:0;background:var(--surface)}
.wcol .wh{font-size:13px;font-weight:700;padding:6px 10px;background:var(--tint);color:var(--navy);border-radius:10px 10px 0 0}
.wcol.today .wh{background:var(--grad);color:#fff}
.wcol .none{color:var(--grey);padding:0 10px;font-size:13px}
.wev{margin:0 8px;border:1px solid var(--line);border-left:4px solid var(--primary);background:var(--surface);border-radius:8px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;font-size:12.5px;color:var(--grey)}
.wev b{font-size:14.5px;color:var(--ink)}.wev:hover{border-color:var(--primary)}
.cal-jump{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--grey);margin-top:12px}
.cal-jump a{cursor:pointer;font-weight:700}
.cal-note{font-size:13px;color:var(--grey);margin:10px 0 0}
/* 場次列表 */
.ltools{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.ltools .chips{flex:1}.ltools .sort{height:32px}
.dlist{display:flex;flex-direction:column;gap:18px}
.dg{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:start}
.dbadge{background:var(--surface);box-shadow:var(--shadow);border-radius:12px;text-align:center;padding:8px 6px;position:sticky;top:12px;border-top:4px solid var(--primary)}
.dbadge small{display:block;font-size:12px;color:var(--grey)}
.dbadge b{display:block;font-size:32px;line-height:1.15;font-weight:800}
.dbadge span{display:block;font-size:12.5px;font-weight:700;color:var(--grey)}
.dbadge.nd{border-top-color:var(--line)}.dbadge.nd b{color:var(--grey)}
.dcards{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:18px;padding:14px 18px;cursor:pointer;align-items:start}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--tint)}
.row .who b{display:block;font-size:17px}.row .who span{font-size:12.5px;color:var(--grey)}
.row .what b{font-size:15px;color:var(--primary)}.row .what .when{font-size:13px;color:var(--grey)}
.row .what p{margin:3px 0 0;font-size:14px;color:var(--grey);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{display:flex;gap:6px 10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;max-width:240px}
.row .meta a.chip{text-decoration:none}
/* 手機 */
@media (max-width:1000px){.hero-in{grid-template-columns:1fr}.hero-art{max-width:560px;margin:0 auto;width:100%}.irail{grid-auto-columns:calc((100% - 2*16px)/3)}.frail{grid-auto-columns:calc((100% - 20px)/2)}.panels{grid-template-columns:1fr}}
@media (max-width:900px){
  header{padding:0 14px}nav.top{display:none}.menu{margin-left:auto}.menu .d{display:none}.menu .m{display:inline}
  aside{max-height:calc(100vh - var(--hdr))}.side-in{padding:12px 16px 18px}.mnav{display:flex}.side-t{display:none}.find{max-width:none}.tree{column-width:auto;columns:1}
  .hero-in{padding:28px 16px 24px}.sec{padding:40px 16px 4px}.intro{padding:36px 16px 4px}
  .irail{grid-auto-columns:calc((100% - 16px)/2.3)}.frail{grid-auto-columns:85%}
  .phead .inner{padding:0 16px}#main>.view{padding:20px 16px 48px}
  .cal{padding:12px 10px}.cal-h{gap:6px}.cal-h>b{min-width:0;font-size:15px}.seg button{padding:0 12px}
  .dc{min-height:54px;padding:3px}.ev{font-size:11px;padding:1px 4px}.wg{grid-template-columns:1fr}.wcol{min-height:0}
  .dg{grid-template-columns:1fr;gap:10px}.dbadge{position:static;display:flex;align-items:baseline;gap:10px;text-align:left;padding:6px 12px;width:max-content;border-top:0;border-left:4px solid var(--primary)}.dbadge b{font-size:22px}
  .row{grid-template-columns:1fr;gap:6px}.row .meta{justify-content:flex-start;max-width:none}
  .foot-in{grid-template-columns:1fr;gap:14px;padding:0 16px}.foot .fl{text-align:left;flex-direction:row;flex-wrap:wrap;gap:14px}
  .sbar{padding-left:14px}.sbar .btn{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v5：與單場儀表板統一視覺 ===== */
:root{--bg:#f8f8f8;--line:#dadada;--primary:#1970b8;--link:#186eb4;--navy:#204383;--deep:#0b2140;--teal:#4d9ee0;--tint:rgba(32,67,131,.07);--tint2:rgba(25,112,184,.08);
 --grad:linear-gradient(90deg,#204383,#1970b8);--r:8px;--shadow:0 1px 2px rgba(11,33,64,.06),0 4px 14px rgba(11,33,64,.06);--shadow2:0 10px 30px rgba(11,33,64,.16)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--surface:#181d24;--line:#2c3440;--primary:#4d9ee0;--link:#7db8ec;--navy:#a9c3e6;--deep:#0a1a33;--teal:#7db8ec;--tint:rgba(169,195,230,.1);--grad:linear-gradient(90deg,#3f7fc0,#4d9ee0)}}
.brand b{letter-spacing:1px}
.btn{border-radius:6px;box-shadow:none}.btn.ghost{border-radius:6px}
.menu{border-radius:6px}.menu[aria-expanded=true]{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.menu[aria-expanded=true]{background:#204383}}
nav.top a[aria-current=true]::after{background:var(--primary)}
.chip,.fchip,.tab,.sslist .ss,.hot button,.try button,.res-h button,.fbar button,.openbtn{border-radius:4px}
.fchip[aria-pressed=true],.tab[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--primary);border-color:var(--primary)}
.ev{background:var(--primary);border-radius:3px}
/* 深色主視覺，比照儀表板首屏 */
.hero{background:var(--deep);color:var(--on-dark);overflow:visible;z-index:3;padding-bottom:44px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:45px;background:var(--bg);clip-path:polygon(0 100%,100% 0,100% 100%);pointer-events:none}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.hero-in{position:relative;padding:44px 32px 28px}
.eyebrow{font-size:13px;letter-spacing:3px;color:#7fb6e6;font-weight:700;margin-bottom:6px}
.hero h1{color:#fff;font-size:clamp(36px,4.6vw,58px);letter-spacing:4px;line-height:1.2}

/* 點陣化：把文字畫到小畫布再取樣，變成 LED 看板的點 */
function rasterize(segs,G){

  let W=0;const runs=segs.map(s=>{const w=Math.ceil(m.measureText(s.t).width);const r=Object.assign({x:W,w},s);W+=w;return r;});
  W=Math.max(W,1);const H=G+2,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');c.font=font;c.textBaseline='middle';c.fillStyle='#000';runs.forEach(r=>c.fillText(r.t,r.x,H/2+1));

  return {W,H,bits,runs,col};
}

function rangeSVG(rows,opt){opt=opt||{};const W=opt.w||600,H=opt.h||340,L=opt.l||64,R=16,T=34,B=44,dark=!!opt.dark,pp=rows[0].g.unit==='%';

/* 新手指南：法說會是什麼、怎麼讀一份儀表板、名詞小辭典 */
const GLOSSARY=[
  ['法說會','法人說明會。上市櫃公司向投信、外資、券商分析師等法人說明營運成果與未來展望的會議，通常在每季財報公布前後舉行，分成「管理層簡報」與「問答（Q&A）」兩段。'],
  ['財務指引','英文 guidance。管理層對下一季或全年的預估，例如「第四季營收介於 523 億至 543 億美元」。市場常把它當成公司對前景的正式表態。'],
  ['上修／下修','這一場的指引比上一場說得更好叫上修，更差叫下修；說法相同為「維持」，上一場沒提到的為「新增」。依台股慣例，紅色是上修，綠色是下修。'],
  ['營收','公司銷售產品或服務的總收入，是最基本的規模指標。'],
  ['毛利率','（營收 − 直接成本）÷ 營收。反映產品本身賺錢的能力，數字越高代表定價能力或製造效率越好。'],
  ['營業利益率','毛利再扣掉研發、行銷、管理等營業費用後，占營收的比例，反映本業整體的獲利能力。'],
  ['EPS','每股盈餘。稅後淨利除以流通在外股數，代表每一股賺了多少錢。'],
  ['季增／年增','季增（QoQ）是和上一季比，年增（YoY）是和去年同一季比。看年增可以排除季節性的影響。'],
  ['資本支出','英文 CapEx。蓋廠房、買設備等長期投資的金額。調高通常代表公司看好未來需求。'],
  ['產能利用率','又稱稼動率。實際產出占最大產能的比例；偏低代表訂單不足，固定成本會壓縮毛利。'],
  ['ASP','平均售價（Average Selling Price）。每單位產品平均賣多少錢，漲價或產品組合變好都會讓 ASP 上升。'],
  ['存貨天數','手上的存貨大約可以賣幾天。天數上升可能代表需求轉弱或備貨增加，常需搭配管理層的說法判斷。'],
  ['HPC','高效能運算（High Performance Computing），包含 AI 伺服器、資料中心等需要大量運算的應用。'],
  ['先進製程','晶片上電路的線寬，以奈米表示，數字越小越先進，例如 3 奈米、2 奈米。'],
  ['先進封裝','把多顆晶片封裝在一起以提升效能的技術，例如台積電的 CoWoS，AI 晶片大量使用。'],
  ['語調分數','本站依詞表計算管理層發言偏正面或偏保守的程度，範圍 −1 到 +1，講稿與 Q&A 分開計算。它描述「怎麼說」，不代表公司好壞。'],
  ['整體評價','本站依固定標準把一場法說會歸為悲觀、保守、中性、審慎樂觀、樂觀五級，依據指引上下修、數字成長與管理層提到的風險。不是投資建議。']];

    h('h2',{text:'在本站可以怎麼用'}),

  $('#main').replaceChildren(v);
  if(guideTerm){const k=GLOSSARY.find(([t])=>t.split('／').includes(guideTerm)||t===guideTerm);guideTerm='';
