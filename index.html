<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法說會儀表板｜每個數字都查得到出處</title>

<meta property="og:title" content="法說會儀表板">
<meta property="og:description" content="這場改變了什麼、每個數字的出處、跨季的指引與語調變化。台灣經濟新報（TEJ）實習專案。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b2140">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b2140'/%3E%3Crect x='14' y='34' width='8' height='16' rx='2' fill='%237fb6e6'/%3E%3Crect x='28' y='24' width='8' height='26' rx='2' fill='%234d9ee0'/%3E%3Crect x='42' y='14' width='8' height='36' rx='2' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{--ink:#1d2433;--grey:#5f6b7c;--muted:#8a95a5;--bg:#f4f7fb;--surface:#fff;--line:#e2e8f0;--primary:#1766b8;--link:#1462b0;--navy:#0b3a7a;--teal:#1d9a96;--tint:#eaf2fb;--tint2:#e8f6f4;
 --grad:linear-gradient(90deg,#1766b8,#1d9a96);--dome1:#e3eefb;--dome2:#f7fbff;--hex1:#ffffff;--hex2:#e6f0fb;--up:#d62f3c;--down:#14915a;--hdr:64px;--r:14px;--shadow:0 6px 24px rgba(16,52,102,.08);--shadow2:0 10px 30px rgba(16,52,102,.14);
 --font:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--on-dark:#e9f1fa;--on-dark-2:#9fb4cf}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#e6ebf2;--grey:#a3afbf;--muted:#7d8899;--bg:#0f141b;--surface:#171e27;--line:#2a3442;--primary:#4d9ee0;--link:#7db8ec;--navy:#a9c3e6;--teal:#4cc3bd;--tint:rgba(77,158,224,.14);--tint2:rgba(76,195,189,.12);--grad:linear-gradient(90deg,#4d9ee0,#4cc3bd);--dome1:#1b2a3d;--dome2:#141c26;--hex1:#1e2a38;--hex2:#17202b;--up:#ff6b74;--down:#3ccf8e;--shadow:0 6px 24px rgba(0,0,0,.35);--shadow2:0 10px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.7;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);padding:8px 12px}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 頁首 */
header{height:var(--hdr);flex-shrink:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 24px;position:relative;z-index:40;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(16,52,102,.05)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer}
.brand img{height:30px;width:auto}
@media (prefers-color-scheme:dark){.brand img{background:#fff;border-radius:5px;padding:2px 4px}}
.brand b{display:block;font-size:17px;line-height:1.15;letter-spacing:.5px}.brand small{display:block;font-size:11px;color:var(--grey);font-weight:600;letter-spacing:.3px}
nav.top{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.top a{text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;padding:8px 14px;border-radius:8px;cursor:pointer}
nav.top a:hover{color:var(--primary);background:var(--tint)}
nav.top a[aria-current=true]{color:var(--primary)}
nav.top a[aria-current=true]::after{content:"";display:block;height:2px;background:var(--grad);border-radius:2px;margin-top:2px}
.menu{display:inline-flex;align-items:center;gap:8px;margin-left:8px;height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14.5px;padding:0 16px}
.menu:hover{border-color:var(--primary);color:var(--primary)}
.menu i{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.menu[aria-expanded=true]{background:var(--grad);color:#fff;border-color:transparent}
.menu[aria-expanded=true] i{transform:translateY(2px) rotate(-135deg)}
.menu .m{display:none}
.gen{display:none}
.shell{flex:1;display:flex;min-height:0}
main{flex:1;min-width:0;overflow:auto;position:relative}
/* 公司選單面板 */
aside{position:fixed;top:calc(var(--hdr) + env(safe-area-inset-top,0px));left:0;right:0;max-height:min(78vh,720px);z-index:35;background:var(--surface);box-shadow:var(--shadow2);border-radius:0 0 18px 18px;display:none}
aside.show{display:flex;animation:drop .2s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.scrim{position:fixed;left:0;right:0;bottom:0;top:calc(var(--hdr) + env(safe-area-inset-top,0px));background:rgba(15,30,55,.35);z-index:34;display:none}
.scrim.show{display:block}
.side-in{max-width:1200px;width:100%;margin:0 auto;padding:18px 32px 22px;display:flex;flex-direction:column;min-height:0;gap:14px}
.side-top{display:flex;align-items:center;gap:14px}
.side-t{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}.side-t::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--grad)}
.find{flex:1;max-width:420px}
.find input{width:100%;height:40px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
.side-top .x{margin-left:auto}
.tree{overflow:auto;padding:2px 8px 8px 2px;column-width:250px;column-gap:18px}
.ind{break-inside:avoid;margin-bottom:16px}
.ind h4{margin:0 0 8px;font-size:13px;color:var(--grey);display:flex;align-items:center;gap:10px}
.ind h4::after{content:"";flex:1;height:1px;background:var(--line)}
.cogrid{display:grid;grid-template-columns:1fr;gap:8px}
.cocard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.cocard:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.cocard.cur{border-color:var(--primary);background:var(--tint)}
.co-h{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0;text-align:left;width:100%}
.co-h b{font-size:16px}.co-h .tk{font-size:12.5px;color:var(--grey)}.co-h em{margin-left:auto;font-style:normal;font-size:12px;color:var(--grey)}
.co-h:hover b{color:var(--link)}
.sslist{display:flex;flex-wrap:wrap;gap:6px}
.sslist .ss{white-space:nowrap;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px;background:var(--bg)}
.sslist .ss small{color:var(--grey)}
.sslist .ss:hover{border-color:var(--primary);color:var(--primary)}
.sslist .ss[aria-current=true]{background:var(--primary);color:#fff;border-color:var(--primary)}.sslist .ss[aria-current=true] small{color:#dbeafa}
.mnav{display:none;gap:6px;flex-wrap:wrap}
.mnav a{text-decoration:none;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--primary);cursor:pointer}
/* 共用元件 */
.btn{height:44px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;border:0;background:var(--grad);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(23,102,184,.25)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--primary);box-shadow:none}
.nb{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.nb:hover{border-color:var(--primary);color:var(--primary)}
.nb:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--primary);color:var(--primary);white-space:nowrap;background:var(--surface)}
.chip.flat{border-color:var(--line);color:var(--grey);background:var(--bg)}
.rev{font-size:12.5px;font-weight:800;white-space:nowrap}.rev.up{color:var(--up)}.rev.down{color:var(--down)}.rev.keep{color:var(--grey)}
.flag{font-size:11px;font-weight:700;color:#b45309;border:1px solid #f0c27a;background:#fff8eb;border-radius:999px;padding:0 7px;white-space:nowrap}
@media (prefers-color-scheme:dark){.flag{background:transparent}}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding:0 14px;font-size:13.5px;font-weight:700}
.fchip em{font-style:normal;font-size:12px;color:var(--grey);margin-left:4px}
.fchip:hover{border-color:var(--primary)}
.fchip[aria-pressed=true]{background:var(--grad);border-color:transparent;color:#fff}.fchip[aria-pressed=true] em{color:#e6f4ff}
.fchip.sm{height:28px;font-size:13px;padding:0 11px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:14px;color:var(--grey);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px 16px}
mark{background:#fff3a6;color:#0d0d0d;border-radius:2px;padding:0 1px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
/* 區塊標題 */
.sec{max-width:1200px;margin:0 auto;padding:56px 32px 8px}
.st{display:flex;align-items:center;gap:12px;margin:0 0 20px;flex-wrap:wrap}
.st h2{margin:0;font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.st h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--grad)}
.st .sub{color:var(--grey);font-size:14px}
.st .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.st .sp a{font-weight:700;text-decoration:none;cursor:pointer}
/* 首頁：主視覺 */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 100%)}
.hero-in{max-width:1200px;margin:0 auto;padding:48px 32px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:center}
.hero h1{margin:0;font-size:clamp(30px,3.6vw,44px);line-height:1.35;font-weight:900;letter-spacing:1px}
.hero h1 .dots{font-size:.5em;color:var(--teal);letter-spacing:2px;vertical-align:middle;margin-left:8px}
.hero .lead2{color:var(--grey);margin:12px 0 22px;font-size:16px;max-width:520px}
.sbar{display:flex;align-items:center;background:var(--surface);border-radius:999px;box-shadow:var(--shadow2);padding:6px 6px 6px 18px;gap:10px;max-width:560px}
.sbar .ic{width:16px;height:16px;border:2px solid var(--grey);border-radius:50%;position:relative;flex-shrink:0}
.sbar .ic::after{content:"";position:absolute;width:6px;height:2px;background:var(--grey);right:-5px;bottom:-2px;transform:rotate(45deg)}
.sbar input{flex:1;min-width:0;height:44px;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.sbar input:focus{outline:none}
.sbar .btn{height:44px}
.sopt{display:flex;gap:16px;margin:12px 0 0 6px;font-size:14px;color:var(--grey);flex-wrap:wrap;align-items:center}
.sopt label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.sopt input{accent-color:var(--primary);width:16px;height:16px}
.hot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0 0 6px;font-size:13.5px;color:var(--grey)}
.hot button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:28px;padding:0 12px;font-size:13px}
.hot button:hover{border-color:var(--primary);color:var(--primary)}
.hero-art svg{width:100%;height:auto;display:block}
.float{animation:flt 5s ease-in-out infinite}.float.d2{animation-delay:-1.6s}.float.d3{animation-delay:-3.2s}
@keyframes flt{50%{transform:translateY(-8px)}}
/* LED 跑馬燈 */
.led{background:#0b0f14;border-top:3px solid #1b2430;border-bottom:3px solid #1b2430;display:flex;align-items:stretch;position:relative}
.led-lab{flex-shrink:0;display:flex;align-items:center;padding:0 14px 0 18px;background:#141b24;border-right:2px solid #1b2430}
.led-screen{flex:1;min-width:0;position:relative;padding:10px 0}
.led canvas{display:block;width:100%}
.led-lab canvas{width:auto}
.led-screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0b0f14,transparent 3%,transparent 97%,#0b0f14)}
.led-ctl{white-space:nowrap;position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:2;border:1px solid #2c3846;background:#141b24;color:#ffb020;border-radius:6px;height:28px;padding:0 10px;font-family:var(--mono);font-size:12px}
/* 像素字標與簡介 */
.intro{text-align:center;padding:52px 24px 10px;max-width:980px;margin:0 auto}
.intro canvas{max-width:100%;height:auto}
.intro p{color:var(--grey);margin:12px auto 0;max-width:820px;font-size:15.5px}
/* 產業分類 */
.irail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 4*16px)/5);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 18px;scrollbar-width:none}
.irail::-webkit-scrollbar{display:none}
.itile{scroll-snap-align:start;border:0;background:var(--tint);border-radius:var(--r);padding:22px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
.itile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.itile svg{width:56px;height:56px}
.itile b{font-size:17px}.itile span{font-size:13px;color:var(--grey)}
/* 兩欄面板 */
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.panel{background:var(--tint);border-radius:var(--r);padding:18px 20px 20px;display:flex;flex-direction:column;min-width:0}
.panel>h3{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:8px;color:var(--navy)}
.panel>h3 svg{width:22px;height:22px}
.ptabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ptabs button{border:0;background:none;padding:6px 2px;font-weight:700;font-size:15px;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary)}
.pitem{display:block;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);cursor:pointer}
.pitem:hover b{color:var(--primary)}
.pitem b{font-size:15.5px;display:block}
.pmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--grey);margin-top:4px}
.pmeta .sep{color:var(--line)}
.panel .more{margin-top:16px;align-self:flex-start}
.panel .cal{background:var(--surface);box-shadow:none;padding:12px}
.panel .dc{min-height:58px}
/* 儀表板功能 */
.feat{color:var(--grey);margin:-6px 0 18px;max-width:900px}
.frail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 2*20px)/3);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 18px;scrollbar-width:none}
.frail::-webkit-scrollbar{display:none}
.fcard{scroll-snap-align:start;display:flex;flex-direction:column;gap:10px}
.fcard figure{margin:0;border-radius:var(--r);overflow:hidden;background:#0b2140;box-shadow:var(--shadow);aspect-ratio:1200/716}
.fcard img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.fcard b{font-size:16px}.fcard p{margin:0;font-size:14px;color:var(--grey)}
/* 頁尾 */
.foot{background:#eef1f5;margin-top:56px;padding:34px 0 26px;border-top:1px solid var(--line)}
@media (prefers-color-scheme:dark){.foot{background:#131920}}
.foot-in{max-width:1200px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:start}
.foot img{height:44px;width:auto}
@media (prefers-color-scheme:dark){.foot img{background:#fff;border-radius:6px;padding:4px 6px}}
.foot p{margin:0 0 6px;font-size:13.5px;color:var(--grey)}
.foot .fl{display:flex;flex-direction:column;gap:4px;text-align:right}.foot .fl a{cursor:pointer;font-weight:700;text-decoration:none;font-size:14px}
.foot .cp{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.totop{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;border:0;background:var(--grad);color:#fff;font-size:20px;font-weight:800;box-shadow:var(--shadow2);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .25s;z-index:20}
.totop.show{opacity:1;pointer-events:auto;transform:none}
/* 內頁 */
.phead{background:linear-gradient(180deg,var(--surface),var(--bg));padding:30px 0 6px}
.phead .inner{max-width:1200px;margin:0 auto;padding:0 32px}
.phead .crumb{font-size:13.5px;color:var(--grey);margin:0 0 8px}.phead .crumb a{cursor:pointer;text-decoration:none}
.phead .sh-row{display:none}
.phead h1{margin:0 0 8px;font-size:clamp(28px,3.2vw,38px);font-weight:900;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phead h1::before{content:"";width:7px;height:.9em;border-radius:4px;background:var(--grad)}
.phead h1 .cur{display:none}
.phead .lead{color:var(--grey);margin:0;max-width:820px}
#main>.view{max-width:1200px;margin:0 auto;padding:26px 32px 56px}
.crumb{font-size:13.5px;color:var(--grey);margin-bottom:8px}.crumb a{cursor:pointer;text-decoration:none}
h1{margin:0 0 6px;font-size:30px;line-height:1.25}
.view h2{font-size:21px;font-weight:800;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.view>h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--grad)}
#main>.view>h2:first-child{margin-top:0}
.lead{color:var(--grey);margin:0 0 18px;max-width:780px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:34px;padding:0 14px;font-size:14px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.tab em{font-style:normal;font-size:12px;color:var(--grey)}.tab[aria-pressed=true]{background:var(--grad);color:#fff;border-color:transparent}.tab[aria-pressed=true] em,.tab[aria-pressed=true] .rev{color:#fff}
.tbl{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--tint);font-size:12.5px;color:var(--navy);white-space:nowrap}
td.t{font-weight:700;color:var(--link);white-space:nowrap}
tr:last-child td{border-bottom:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.scard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:8px}
.scard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.scard .top b{font-size:17px}
.scard p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.scard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13.5px}.scard dt{color:var(--grey)}.scard dd{margin:0}
.openbtn{align-self:flex-start;margin-top:auto;border:0;background:var(--grad);color:#fff;border-radius:999px;height:36px;padding:0 16px;font-weight:700;font-size:14px}
.chart{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}

.sbox input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.try{font-size:13.5px;color:var(--grey);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.try button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:28px;padding:0 12px;font-size:13px}
.res{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-top:12px}
.res-h{display:flex;gap:10px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.res-h b{font-size:16px}.res-h span{font-size:13px;color:var(--grey)}
.res-h button{margin-left:auto;border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:999px;height:30px;padding:0 12px;font-size:13px;font-weight:700}
.hit{padding:10px 16px;border-bottom:1px dashed var(--line);font-size:14.5px}.hit:last-child{border-bottom:0}
.hit i{font-style:normal;font-size:12px;font-weight:700;color:var(--primary);margin-right:8px}
.about p,.about li{font-size:15.5px}.about p,.about ul,.about .box{max-width:820px}
.about ul{padding-left:22px}
.box{background:var(--tint);border-left:4px solid var(--primary);border-radius:10px;padding:14px 16px;margin:12px 0}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:13px;color:var(--grey)}
.frame{position:absolute;inset:0;display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);font-size:14px;flex-shrink:0;flex-wrap:wrap}
.fbar a{cursor:pointer;text-decoration:none}.fbar .sp{margin-left:auto;display:flex;gap:6px}
.fbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:30px;padding:0 12px;font-size:13px;font-weight:700}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
/* 行事曆 */
.cal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-h>b{font-size:17px;min-width:150px;text-align:center}
.cal-h .sp{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-right:6px}
.seg button{border:0;background:var(--surface);height:30px;padding:0 16px;font-size:13.5px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--grad);color:#fff}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mg .wd{font-size:12px;color:var(--grey);font-weight:700;text-align:center}
.dc{min-height:80px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface)}
.dc.out{background:var(--bg);opacity:.55}
.dc.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.dc .d{font-weight:700;color:var(--grey)}.dc.today .d{color:var(--teal)}
.ev{border:0;text-align:left;background:var(--grad);color:#fff;border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev:hover{filter:brightness(1.1)}
.wg{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:6px}
.wcol{border:1px solid var(--line);border-radius:10px;min-height:160px;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;min-width:0;background:var(--surface)}

.wcol.today .wh{background:var(--grad);color:#fff}
.wcol .none{color:var(--grey);padding:0 10px;font-size:13px}

.wev b{font-size:14.5px;color:var(--ink)}.wev:hover{border-color:var(--primary)}
.cal-jump{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--grey);margin-top:12px}
.cal-jump a{cursor:pointer;font-weight:700}
.cal-note{font-size:13px;color:var(--grey);margin:10px 0 0}

.dbadge.nd{border-top-color:var(--line)}.dbadge.nd b{color:var(--grey)}
.dcards{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:18px;padding:14px 18px;cursor:pointer;align-items:start}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--tint)}

.row .meta a.chip{text-decoration:none}
/* 手機 */
@media (max-width:1000px){.hero-in{grid-template-columns:1fr}.hero-art{max-width:560px;margin:0 auto;width:100%}.irail{grid-auto-columns:calc((100% - 2*16px)/3)}.frail{grid-auto-columns:calc((100% - 20px)/2)}.panels{grid-template-columns:1fr}}
@media (max-width:900px){
  header{padding:0 14px}nav.top{display:none}.menu{margin-left:auto}.menu .d{display:none}.menu .m{display:inline}

  .irail{grid-auto-columns:calc((100% - 16px)/2.3)}.frail{grid-auto-columns:85%}
  .phead .inner{padding:0 16px}#main>.view{padding:20px 16px 48px}
  .cal{padding:12px 10px}.cal-h{gap:6px}.cal-h>b{min-width:0;font-size:15px}.seg button{padding:0 12px}
  .dc{min-height:54px;padding:3px}.ev{font-size:11px;padding:1px 4px}.wg{grid-template-columns:1fr}.wcol{min-height:0}
  .dg{grid-template-columns:1fr;gap:10px}.dbadge{position:static;display:flex;align-items:baseline;gap:10px;text-align:left;padding:6px 12px;width:max-content;border-top:0;border-left:4px solid var(--primary)}.dbadge b{font-size:22px}
  .row{grid-template-columns:1fr;gap:6px}.row .meta{justify-content:flex-start;max-width:none}
  .foot-in{grid-template-columns:1fr;gap:14px;padding:0 16px}.foot .fl{text-align:left;flex-direction:row;flex-wrap:wrap;gap:14px}
  .sbar{padding-left:14px}.sbar .btn{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script src="index.js"></script>
<script>
(function(){

const IDX=window.EC_INDEX||{companies:[]};

const curId=()=>{try{return decodeURIComponent(location.hash.slice(1));}catch(e){return location.hash.slice(1);}};
const C=IDX.companies, byTk=Object.fromEntries(C.map(c=>[c.ticker,c]));
const ALL=C.flatMap(c=>c.sessions.map(s=>({c,s})));
const label=s=>s.year&&s.quarter?`${s.year} Q${s.quarter}`:(s.date||s.key);
const dshort=s=>s.date?s.date.replace(/^(\d{4})-0?(\d+)-0?(\d+)$/,'$1/$2/$3'):'';

document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go);toggleSide(false);}});
$('#gen').textContent=IDX.generated?'資料更新：'+IDX.generated:'';

/* 從上方展開的公司選單 */
function buildTree(filter){
  const tree=$('#tree');tree.replaceChildren();const f=(filter||'').trim().toLowerCase();
  const list=C.filter(c=>!f||c.name.toLowerCase().includes(f)||c.ticker.toLowerCase().includes(f));

  const groups={};list.forEach(c=>(groups[c.industry||'其他']=groups[c.industry||'其他']||[]).push(c));
  Object.keys(groups).forEach(ind=>{
    tree.append(h('section',{class:'ind'},h('h4',{text:`${ind}（${groups[ind].length}）`}),h('div',{class:'cogrid'},groups[ind].map(c=>{
      const hb=h('button',{type:'button',class:'co-h',title:`看${c.name}的跨季追蹤`},h('b',{text:c.name}),h('span',{class:'tk',text:c.ticker!==c.name?c.ticker:''}),h('em',{class:'num',text:c.sessions.length+' 場'}));
      hb.addEventListener('click',()=>{go('c-'+c.ticker);toggleSide(false);});
      const ss=h('div',{class:'sslist'},c.sessions.slice().reverse().map(s=>{const b=h('button',{class:'ss',type:'button','data-id':sid(c.ticker,s.key)},label(s),s.date?h('small',{text:dshort(s)}):null,s.flags.length?h('span',{class:'flag',text:'注意'}):null);
        b.addEventListener('click',()=>{go(sid(c.ticker,s.key));toggleSide(false);});return b;}));
      return h('div',{class:'cocard','data-tk':c.ticker},hb,ss);}))));});
  markCurrent();
}
function markCurrent(){const id=curId();
  $$('nav.top [data-go], .mnav [data-go]').forEach(a=>a.setAttribute('aria-current',a.dataset.go===id?'true':'false'));
  $$('.cocard').forEach(x=>{const tk=x.dataset.tk;x.classList.toggle('cur',id==='c-'+tk||id.startsWith('s-'+tk+'-'));});
  $$('.ss').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id?'true':'false'));}
function toggleSide(v){const s=$('#side');const o=v==null?!s.classList.contains('show'):v;s.classList.toggle('show',o);$('#scrim').classList.toggle('show',o);$('#menu').setAttribute('aria-expanded',String(o));
  if(o&&innerWidth>900)setTimeout(()=>$('#q').focus(),30);}
$('#menu').addEventListener('click',()=>toggleSide());
$('#scrim').addEventListener('click',()=>toggleSide(false));
$('#sidex').addEventListener('click',()=>toggleSide(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#side').classList.contains('show')){toggleSide(false);$('#menu').focus();}});
$('#q').addEventListener('input',e=>buildTree(e.target.value));

function footer(){return h('footer',{class:'site'},'內容由 AI 依法說會逐字稿整理，僅供參考，不構成投資建議。逐字稿來源：TEJ 逐字稿資料庫。'+(IDX.site?'本網站使用公開版儀表板，只保留引用的原句。':''));}
/* 首頁 */
let heroTimer=null,heroIdx=0;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const WD=['一','二','三','四','五','六','日'];
const dow=d=>(d.getDay()+6)%7;
const newest=()=>ALL.slice().sort((a,b)=>order(b.s).localeCompare(order(a.s)));
const toneLab=s=>s.tone&&s.tone.presentation&&s.tone.presentation.label;
const qname=s=>s.year&&s.quarter?`${s.year} 年第 ${s.quarter} 季法說會`:'法說會';
/* 區塊標題：01 ■ LABEL ───── 註記，下面接大標 */
function secHead(no,lab,title,note,more){
  return h('div',{class:'sh'},h('div',{class:'sh-row'},h('span',{class:'no',text:no}),h('span',{class:'lb'},h('i'),lab),h('span',{class:'rule'}),note?h('span',{class:'code',text:note}):null),
    h('h2',{class:'big'},title,h('span',{class:'cur','aria-hidden':'true'}),more||null));
}
/* ===== 首頁（入口網站） ===== */
/* 點陣化：把文字畫到小畫布再取樣，變成 LED 看板的點 */
function rasterize(segs,G){
  const font=`700 ${G}px "PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif`;
  const m=document.createElement('canvas').getContext('2d');m.font=font;
  let W=0;const runs=segs.map(s=>{const w=Math.ceil(m.measureText(s.t).width);const r=Object.assign({x:W,w},s);W+=w;return r;});
  W=Math.max(W,1);const H=G+2,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');c.font=font;c.textBaseline='middle';c.fillStyle='#000';runs.forEach(r=>c.fillText(r.t,r.x,H/2+1));
  const d=c.getImageData(0,0,W,H).data,bits=new Uint8Array(W*H);for(let i=0;i<W*H;i++)bits[i]=d[i*4+3]>110?1:0;
  const col=new Int16Array(W).fill(-1);runs.forEach((r,k)=>{for(let x=r.x;x<r.x+r.w&&x<W;x++)col[x]=k;});
  return {W,H,bits,runs,col};
}
function drawDots(cv,R,off,P,cols){const dpr=devicePixelRatio||1,hpx=R.H*P,w=cols?cols*P:cv.clientWidth;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(hpx*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(hpx*dpr);cv.style.height=hpx+'px';if(cols)cv.style.width=w+'px';}
  const c=cv.getContext('2d'),s=P*.74,n=Math.ceil(w/P)+1;c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#0b0f14';c.fillRect(0,0,w,hpx);
  c.fillStyle='#18212c';for(let x=0;x<n;x++)for(let y=0;y<R.H;y++)c.fillRect(x*P,y*P,s,s);
  for(let x=0;x<n;x++){const sx=((Math.floor(off)+x)%R.W+R.W)%R.W,k=R.col[sx];c.fillStyle=k>=0?R.runs[k].c:'#ffe9b0';
    for(let y=0;y<R.H;y++)if(R.bits[y*R.W+sx])c.fillRect(x*P,y*P,s,s);}}
/* 最新上線：LED 跑馬燈 */
function ledTicker(){
  const list=newest().slice(0,8);if(!list.length)return null;
  const CY='#ffb020',CW='#ffe9b0',CR='#ff5a5a',CG='#3ddc84',CB='#6cc6ff',segs=[];
  list.forEach(x=>{const r=x.s.revisions||{};segs.push({t:'▶ ',c:CB});
    if(x.s.date)segs.push({t:dshort(x.s).replace(/^\d{4}\//,'')+' ',c:CB,ref:x});
    segs.push({t:(x.c.ticker!==x.c.name?x.c.ticker+' ':'')+x.c.name+' ',c:CY,ref:x});segs.push({t:label(x.s)+' 法說會上線 ',c:CW,ref:x});
    if(r['上修'])segs.push({t:'▲上修'+r['上修']+' ',c:CR,ref:x});if(r['下修'])segs.push({t:'▼下修'+r['下修']+' ',c:CG,ref:x});segs.push({t:'　　　',c:CW});});
  const G=15,R=rasterize(segs,G),LB=rasterize([{t:'最新上線',c:CY}],G);
  const cv=h('canvas',{class:'led-cv'}),lc=h('canvas',{'aria-hidden':'true'});
  let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,hover=false,off=0,lastI=-1,t0=0;
  const P=()=>innerWidth<600?2.4:3;
  const ctl=h('button',{type:'button',class:'led-ctl'});const setC=()=>{ctl.textContent=paused?'▶ 播放':'❚❚ 暫停';ctl.setAttribute('aria-label',paused?'播放跑馬燈':'暫停跑馬燈');};
  ctl.addEventListener('click',()=>{paused=!paused;setC();});setC();
  const wrap=h('section',{class:'led','aria-label':'最新上線的法說會'},h('div',{class:'led-lab'},lc),h('div',{class:'led-screen'},cv),ctl,
    h('ul',{class:'sr-only'},list.map(x=>h('li',{},h('a',{href:'#'+sid(x.c.ticker,x.s.key),text:`${x.s.date?dshort(x.s)+' ':''}${x.c.name} ${label(x.s)} 法說會`})))));
  const hit=e=>{const r=cv.getBoundingClientRect(),sx=((Math.floor(off)+Math.floor((e.clientX-r.left)/P()))%R.W+R.W)%R.W,k=R.col[sx];return k>=0?R.runs[k].ref||null:null;};
  cv.addEventListener('mousemove',e=>{cv.style.cursor=hit(e)?'pointer':'default';});
  cv.addEventListener('click',e=>{const x=hit(e);if(x)go(sid(x.c.ticker,x.s.key));});
  wrap.addEventListener('mouseenter',()=>hover=true);wrap.addEventListener('mouseleave',()=>hover=false);
  const loop=t=>{if(!cv.isConnected)return;const dt=t0?Math.min(t-t0,100):0;t0=t;if(!paused&&!hover&&!document.hidden)off+=dt*0.02;
    const i=Math.floor(off);if(i!==lastI||cv.width!==Math.round(cv.clientWidth*(devicePixelRatio||1))){lastI=i;drawDots(cv,R,off,P());}requestAnimationFrame(loop);};
  requestAnimationFrame(()=>{drawDots(lc,LB,0,P(),LB.W);requestAnimationFrame(loop);});
  addEventListener('resize',()=>{if(lc.isConnected)drawDots(lc,LB,0,P(),LB.W);});
  return wrap;

  const y=v=>T+(1-(v+1)/2)*(H-T-B),NS='http://www.w3.org/2000/svg',e=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  const svg=e('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'語調分數趨勢'});
  [-1,-.5,0,.5,1].forEach(v=>{svg.append(e('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:v===0?'#9aa6b2':'#dadada','stroke-width':1,'stroke-dasharray':v===0?'':'3 4'}));const t=e('text',{x:L-8,y:y(v)+4,'text-anchor':'end','font-size':11,fill:'#6b7280'});t.textContent=(v>0?'+':'')+v;svg.append(t);});

    if(P.length>1)svg.append(e('polyline',{points:P.map(p=>p.x+','+y(p.s.tone[k].score)).join(' '),fill:'none',stroke:col,'stroke-width':2.5}));
    P.forEach(p=>{svg.append(e('circle',{cx:p.x,cy:y(p.s.tone[k].score),r:5,fill:col}));const t=e('text',{x:p.x+8,y:y(p.s.tone[k].score)-8,'font-size':12,fill:col,'font-weight':700});t.textContent=fmt(p.s.tone[k].score);svg.append(t);});});
  pts.forEach(p=>{const t=e('text',{x:p.x,y:H-12,'text-anchor':'middle','font-size':12,fill:'#6b7280'});t.textContent=label(p.s);svg.append(t);});
  return h('div',{class:'chart'},svg,h('div',{class:'legend'},h('span',{},h('i',{style:'background:#1970b8'}),'管理層講稿'),h('span',{},h('i',{style:'background:#8a9bb0'}),'Q&A 回答')));
