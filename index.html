<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法說會儀表板｜每個數字都查得到出處</title>
<meta name="description" content="把法說會逐字稿整理成互動儀表板：這場改變了什麼、每個數字的原句、可直接複製的報告稿，以及同一家公司跨季的指引與語調變化。">
<meta property="og:title" content="法說會儀表板">
<meta property="og:description" content="這場改變了什麼、每個數字的出處、跨季的指引與語調變化。台灣經濟新報（TEJ）實習專案。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b2140">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b2140'/%3E%3Crect x='14' y='34' width='8' height='16' rx='2' fill='%237fb6e6'/%3E%3Crect x='28' y='24' width='8' height='26' rx='2' fill='%234d9ee0'/%3E%3Crect x='42' y='14' width='8' height='36' rx='2' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{--ink:#0d0d0d;--grey:#6b7280;--app:#f8f8f8;--surface:#fff;--line:#dadada;--primary:#1970b8;--link:#186eb4;--navy:#204383;--deep:#0b2140;--tint:rgba(32,67,131,.1);
 --up:#d62f3c;--down:#14915a;--hdr:60px;--side:280px;--on-dark:#e9f1fa;--on-dark-2:#9fb4cf;--font:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#e8ecf1;--grey:#9aa6b2;--app:#0f1318;--surface:#181d24;--line:#2c3440;--primary:#4d9ee0;--link:#7db8ec;--navy:#a9c3e6;--tint:rgba(169,195,230,.14);--deep:#0a1a33;--up:#ff6b74;--down:#3ccf8e}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.65;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);padding:8px 12px}
header{height:var(--hdr);flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);cursor:pointer}
.brand img{height:30px;width:auto}
@media (prefers-color-scheme:dark){.brand img{background:#fff;border-radius:5px;padding:2px 4px}}
.brand b{display:block;font-size:16px;line-height:1.15}.brand small{display:block;font-size:11px;color:var(--grey);font-weight:600}
nav.top{display:flex;gap:2px;margin-left:24px}
nav.top a{text-decoration:none;color:var(--grey);font-weight:600;font-size:14.5px;padding:6px 12px;border-radius:6px;cursor:pointer}
nav.top a:hover{color:var(--link)}
nav.top a[aria-current=true]{color:var(--primary);background:rgba(25,112,184,.1)}
.menu{display:none;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;height:36px;padding:0 12px;font-weight:600;font-size:14px}
.gen{margin-left:auto;font-size:12px;color:var(--grey)}
.shell{flex:1;display:flex;min-height:0}
aside{width:var(--side);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.find{padding:12px;border-bottom:1px solid var(--line)}
.find input{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font:inherit;font-size:14px;background:var(--app);color:var(--ink)}
.side-t{font-size:12px;font-weight:700;color:var(--grey);padding:10px 16px 2px}
.tree{flex:1;overflow:auto;padding:4px 8px 20px}
.co{margin:2px 0}
.co>button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px;border-radius:6px;text-align:left}
.co>button:hover{background:var(--tint)}
.co>button[aria-current=true]{background:var(--primary);color:#fff}.co>button[aria-current=true] em,.co>button[aria-current=true] .tk{color:#dbeafa}
.co>button i{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;flex-shrink:0;opacity:.7}
.co.expanded>button i{transform:rotate(45deg)}
.co b{font-size:15px}.co em{font-style:normal;font-size:12px;color:var(--grey);margin-left:auto}.co .tk{font-size:12px;color:var(--grey);font-weight:600}
.yrs{display:none;padding:2px 0 6px 18px}.co.expanded .yrs{display:block}
.yr{font-size:12px;font-weight:700;color:var(--grey);margin:6px 8px 2px}
.ss{width:100%;display:flex;gap:8px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:6px;text-align:left;font-size:14px}
.ss:hover{background:var(--tint)}.ss[aria-current=true]{background:var(--tint);color:var(--primary);font-weight:700}
.ss small{margin-left:auto;font-size:11.5px;color:var(--grey)}
.flag{font-size:11px;font-weight:700;color:#b45309;border:1px solid #f0c27a;border-radius:3px;padding:0 5px;white-space:nowrap}
main{flex:1;min-width:0;overflow:auto;position:relative}
.view{padding:28px 32px 56px;max-width:1180px}
.crumb{font-size:13.5px;color:var(--grey);margin-bottom:8px}.crumb a{cursor:pointer;text-decoration:none}
h1{margin:0 0 6px;font-size:30px;line-height:1.25}
h2{font-size:20px;margin:34px 0 12px;display:flex;align-items:baseline;gap:12px}
h2 a{font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.lead{color:var(--grey);margin:0 0 18px;max-width:760px}
.hero{position:relative;background:var(--deep);color:var(--on-dark);padding:44px 32px 50px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.hero>div{position:relative;max-width:1116px}
.hero .tag{font-size:13px;letter-spacing:2px;color:#7fb6e6;font-weight:700}
.hero h1{color:#fff;font-size:clamp(28px,4vw,42px);margin:8px 0 12px}
.hero p{margin:0;max-width:640px;font-size:16.5px;line-height:1.85;color:var(--on-dark)}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,170px));gap:0;margin-top:26px;border-top:1px solid rgba(255,255,255,.18)}
.hstats div{padding:12px 10px 0 0}.hstats b{display:block;font-size:30px;line-height:1.1;color:#fff}.hstats span{font-size:12.5px;color:var(--on-dark-2)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{height:42px;padding:0 18px;border-radius:6px;font-weight:700;font-size:15px;border:1.5px solid #fff;background:#fff;color:#0b2140;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.how b{display:block;font-size:16px;margin:4px 0}.how span{font-size:12.5px;font-weight:700;color:var(--primary)}.how p{margin:0;font-size:14px;color:var(--grey)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding:0 13px;font-size:13.5px;font-weight:600}
.fchip em{font-style:normal;font-size:12px;color:var(--grey);margin-left:4px}
.fchip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}.fchip[aria-pressed=true] em{color:#dbeafa}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:7px;transition:border-color .2s,transform .2s}
.ccard:hover{border-color:var(--primary);transform:translateY(-2px)}
.ccard .t{display:flex;align-items:baseline;gap:8px}.ccard b{font-size:18px}.ccard .tk{font-size:13px;color:var(--grey)}
.ccard p{margin:0;font-size:13px;color:var(--grey)}
.tbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--grey)}
.tbar .rail{flex:1;height:6px;background:var(--tint);border-radius:3px;position:relative}
.tbar .rail i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:var(--primary);transform:translateX(-50%)}
.tbar .rail::after{content:"";position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--grey);opacity:.5}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid var(--primary);color:var(--primary);white-space:nowrap}
.chip.flat{border-color:var(--line);color:var(--grey)}
.rev{font-size:12.5px;font-weight:700;white-space:nowrap}.rev.up{color:var(--up)}.rev.down{color:var(--down)}.rev.keep{color:var(--grey)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--app);font-size:12.5px;color:var(--grey);white-space:nowrap}
td.t{font-weight:700;color:var(--link);white-space:nowrap}
td.co-n{white-space:nowrap}td.co-n b{display:block}td.co-n span{font-size:12.5px;color:var(--grey)}
tr.go{cursor:pointer}tr.go:hover td{background:var(--tint)}
tr:last-child td{border-bottom:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;height:36px;padding:0 12px;font-size:14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.tab em{font-style:normal;font-size:12px;color:var(--grey)}.tab[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}.tab[aria-pressed=true] em,.tab[aria-pressed=true] .rev{color:#fff}
.sbox{display:flex;gap:8px;margin:6px 0 10px}
.sbox input{flex:1;height:46px;border:1.5px solid var(--line);border-radius:8px;padding:0 14px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.sbox input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.try{font-size:13.5px;color:var(--grey);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.try button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:28px;padding:0 11px;font-size:13px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:12px}
.res-h{display:flex;gap:10px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.res-h b{font-size:16px}.res-h span{font-size:13px;color:var(--grey)}
.res-h button{margin-left:auto;border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:6px;height:30px;padding:0 10px;font-size:13px;font-weight:600}
.hit{padding:10px 16px;border-bottom:1px dashed var(--line);font-size:14.5px}.hit:last-child{border-bottom:0}
.hit i{font-style:normal;font-size:12px;font-weight:700;color:var(--primary);margin-right:8px}
mark{background:#fff3a6;color:#0d0d0d;border-radius:2px;padding:0 1px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.scard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.scard .top b{font-size:17px}
.scard p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.scard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13.5px}.scard dt{color:var(--grey)}.scard dd{margin:0}
.openbtn{align-self:flex-start;margin-top:auto;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:6px;height:34px;padding:0 14px;font-weight:700;font-size:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--grey);margin-top:6px}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.note{font-size:13.5px;color:var(--grey);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:12px 14px}
.frame{position:absolute;inset:0;display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface);font-size:14px;flex-shrink:0;flex-wrap:wrap}
.fbar a{cursor:pointer;text-decoration:none}
.fbar .sp{margin-left:auto;display:flex;gap:6px}
.fbar button{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:30px;padding:0 10px;font-size:13px;font-weight:600}
iframe{flex:1;width:100%;border:0;background:var(--app)}
.about{max-width:780px}
.about p,.about li{font-size:15.5px}
.about ul{padding-left:22px}
.box{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:6px;padding:14px 16px;margin:12px 0}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:13px;color:var(--grey)}
.mnav{display:none;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mnav a{text-decoration:none;font-weight:600;font-size:14px;padding:6px 10px;border-radius:6px;background:var(--tint);color:var(--navy);cursor:pointer}
.car{position:relative;background:var(--deep);color:var(--on-dark);overflow:hidden}
.car::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.car .slides{position:relative;height:360px}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:center;padding:34px 72px 46px;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
.slide.on{opacity:1;visibility:visible}
.slide.noimg{grid-template-columns:minmax(0,760px)}
.slide .tag{font-size:13px;letter-spacing:1.5px;color:#7fb6e6;font-weight:700}
.slide .ttl{color:#fff;font-size:clamp(24px,3vw,34px);line-height:1.3;margin:8px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide p{margin:0;color:var(--on-dark);font-size:15.5px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slide .cta{margin-top:20px}
.slide figure{margin:0;display:flex;align-items:center;justify-content:center;height:100%;min-height:0}
.slide img{width:100%;max-height:270px;object-fit:cover;object-position:top left;border-radius:8px;border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 34px rgba(0,0,0,.4);background:#fff}
.car .arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(11,33,64,.55);color:#fff;font-size:24px;line-height:1;z-index:2;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.car .arr:hover{background:rgba(255,255,255,.15)}
.car .arr.l{left:16px}.car .arr.r{right:16px}
.dots{position:absolute;bottom:16px;left:72px;display:flex;gap:8px;z-index:2;align-items:center}
.dots button{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.4);transition:width .3s}
.dots button[aria-current=true]{width:26px;background:#fff}
.dots .pp{width:auto;height:auto;background:none;color:var(--on-dark-2);font-size:12px;margin-left:10px}
.tick{display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line);height:46px;overflow:hidden}
.tick .lab{flex-shrink:0;display:flex;align-items:center;padding:0 16px;background:var(--primary);color:#fff;font-size:14px}
.tick .lane{flex:1;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.tick .run{display:flex;width:max-content;animation:tk var(--dur,40s) linear infinite}
.tick:hover .run,.tick:focus-within .run{animation-play-state:paused}
.tick a{display:inline-flex;gap:8px;align-items:center;padding:0 24px;white-space:nowrap;text-decoration:none;color:var(--ink);font-size:14px;border-right:1px solid var(--line)}
.tick a:hover b{color:var(--link)}.tick a .v{color:var(--grey)}
@keyframes tk{to{transform:translateX(-50%)}}
h2 .cnt{font-size:13.5px;font-weight:600;color:var(--grey)}
.view>h2:first-child{margin-top:0}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-h>b{font-size:17px;min-width:150px;text-align:center}
.cal-h .sp{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-right:8px}
.seg button{border:0;background:var(--surface);height:32px;padding:0 16px;font-size:13.5px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
.nb{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:32px;min-width:32px;padding:0 10px;font-size:13.5px;font-weight:600}
.nb:hover{border-color:var(--primary);color:var(--primary)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mg .wd{font-size:12px;color:var(--grey);font-weight:700;text-align:center}
.dc{min-height:84px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dc.out{background:var(--app);opacity:.55}
.dc.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.dc .d{font-weight:700;color:var(--grey)}.dc.today .d{color:var(--primary)}
.ev{border:0;text-align:left;background:var(--tint);color:var(--navy);border-radius:4px;padding:2px 6px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev:hover{background:var(--primary);color:#fff}
.wg{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:6px}
.wcol{border:1px solid var(--line);border-radius:6px;min-height:170px;display:flex;flex-direction:column;gap:6px;padding-bottom:8px;min-width:0}
.wcol .wh{font-size:13px;font-weight:700;padding:6px 10px;background:var(--app);border-bottom:1px solid var(--line);color:var(--grey);border-radius:6px 6px 0 0}
.wcol.today .wh{background:var(--primary);color:#fff}
.wcol .none{color:var(--grey);padding:0 10px;font-size:13px}
.wev{margin:0 8px;border:1px solid var(--line);border-left:3px solid var(--primary);background:var(--surface);border-radius:4px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;font-size:12.5px;color:var(--grey)}
.wev b{font-size:14.5px;color:var(--ink)}.wev:hover{border-color:var(--primary)}
.cal-jump{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--grey);margin-top:12px}
.cal-jump a{cursor:pointer;font-weight:600}
.fchip.sm{height:28px;font-size:13px;padding:0 10px}
.cal-note{font-size:13px;color:var(--grey);margin:10px 0 0}
.ltools{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ltools .chips{flex:1}.ltools .sort{height:32px}
.dgrp{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dh{font-size:13px;font-weight:700;color:var(--grey);background:var(--app);padding:7px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dgrp>.dh:first-child{border-top:0}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:18px;padding:12px 16px;cursor:pointer;align-items:start}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--tint)}
.row .who b{display:block;font-size:15.5px}.row .who span{font-size:12.5px;color:var(--grey)}
.row .what b{font-size:15px}.row .what .when{font-size:13px;color:var(--grey)}
.row .what p{margin:2px 0 0;font-size:13.5px;color:var(--grey);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{display:flex;gap:6px 10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;max-width:250px}
.row .meta a.chip{text-decoration:none}
@media (max-width:900px){
  .car .slides{height:400px}.slide{grid-template-columns:1fr;padding:26px 20px 50px}.slide figure{display:none}.car .arr{display:none}.dots{left:20px}
  .dc{min-height:54px;padding:3px}.ev{font-size:11px;padding:1px 3px}.wg{grid-template-columns:1fr}.wcol{min-height:0}
  .cal{padding:12px 10px}.cal-h{gap:6px}.cal-h>b{min-width:0;font-size:15px}.seg{margin-right:0}.seg button{padding:0 12px}
  .row{grid-template-columns:1fr;gap:6px}.row .meta{justify-content:flex-start;max-width:none}
}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.tick .run{animation:none}.tick .lane{overflow-x:auto}.tick a.dup{display:none}}
@media (max-width:900px){
  nav.top{display:none}.menu{display:inline-flex;align-items:center}.gen{display:none}
  aside{position:fixed;top:calc(var(--hdr) + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:25;transform:translateX(-102%);transition:transform .3s;box-shadow:6px 0 20px rgba(0,0,0,.15)}
  aside.show{transform:none}
  .mnav{display:flex}
  .view{padding:20px 16px 48px}.hero{padding:30px 16px 36px}.hstats{grid-template-columns:repeat(2,1fr)}.how{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){aside,.ccard{transition:none}}
</style>

<body>
<a class="skip" href="#main">跳至主要內容</a>
<header>
  <a class="brand" data-go=""><img src="tej_mark.png" alt="台灣經濟新報 TEJ"><span><b>法說會儀表板</b><small>每個數字都查得到出處</small></span></a>
  <nav class="top" aria-label="主要頁面"><a data-go="">首頁</a><a data-go="calendar">行事曆</a><a data-go="revisions">指引修正</a><a data-go="search">搜尋</a><a data-go="about">關於</a></nav>
  <span class="gen" id="gen"></span>
  <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="side">選單</button>
</header>
<div class="shell">
  <aside id="side" aria-label="公司與場次">
    <div class="mnav"><a data-go="">首頁</a><a data-go="calendar">行事曆</a><a data-go="revisions">指引修正</a><a data-go="search">搜尋</a><a data-go="about">關於</a></div>
    <div class="find"><input id="q" type="search" placeholder="篩選公司或股票代號" aria-label="篩選公司或股票代號"></div>
    <div class="side-t">公司</div>
    <nav class="tree" id="tree"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<script src="index.js"></script>
<script>
(function(){
"use strict";
const IDX=window.EC_INDEX||{companies:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function h(t,a,...k){const e=document.createElement(t);if(a)for(const x in a){const v=a[x];if(v==null||v===false)continue;if(x==='class')e.className=v;else if(x==='text')e.textContent=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v);}for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const curId=()=>{try{return decodeURIComponent(location.hash.slice(1));}catch(e){return location.hash.slice(1);}};
const C=IDX.companies, byTk=Object.fromEntries(C.map(c=>[c.ticker,c]));
const ALL=C.flatMap(c=>c.sessions.map(s=>({c,s})));
const label=s=>s.year&&s.quarter?`${s.year} Q${s.quarter}`:(s.date||s.key);
const dshort=s=>s.date?s.date.replace(/^(\d{4})-0?(\d+)-0?(\d+)$/,'$1/$2/$3'):'';
const order=s=>(s.date||'')||`${s.year||0}-${String((s.quarter||0)*3).padStart(2,'0')}-99`;
const fmt=x=>x==null?'—':(x>=0?'+':'−')+Math.abs(x).toFixed(2);
const sid=(tk,key)=>'s-'+tk+'-'+key.replace(/[^0-9A-Za-z]/g,'');
function revTag(v){if(!v)return null;return h('span',{class:'rev '+(v==='上修'?'up':v==='下修'?'down':'keep'),text:(v==='上修'?'▲ ':v==='下修'?'▼ ':'')+v});}
function link(id,text){return h('a',{onclick:()=>go(id),text});}
function go(id){if(curId()===id)route();else location.hash=id;}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go);if(innerWidth<=900)toggleSide(false);}});
$('#gen').textContent=IDX.generated?'資料更新：'+IDX.generated:'';
const REVS=ALL.flatMap(({c,s})=>s.outlook.filter(o=>o.vs_prior).map(o=>({c,s,o}))).sort((a,b)=>order(b.s).localeCompare(order(a.s)));

/* 左側選單 */
function buildTree(filter){
  const tree=$('#tree');tree.replaceChildren();const f=(filter||'').trim().toLowerCase();
  C.filter(c=>!f||c.name.toLowerCase().includes(f)||c.ticker.toLowerCase().includes(f)).forEach(c=>{
    const years={};c.sessions.forEach(s=>(years[s.year||'未知']=years[s.year||'未知']||[]).push(s));
    const box=h('div',{class:'co'+(f?' expanded':''),'data-tk':c.ticker});
    const btn=h('button',{type:'button','aria-expanded':f?'true':'false'},h('i'),h('b',{text:c.name}),h('span',{class:'tk',text:c.ticker!==c.name?c.ticker:''}),h('em',{class:'num',text:c.sessions.length+' 場'}));
    btn.addEventListener('click',()=>{const o=box.classList.toggle('expanded');btn.setAttribute('aria-expanded',o);go('c-'+c.ticker);});
    const yrs=h('div',{class:'yrs'});
    Object.keys(years).sort().reverse().forEach(y=>{yrs.append(h('div',{class:'yr',text:y+' 年'}));
      years[y].slice().reverse().forEach(s=>{const b=h('button',{class:'ss',type:'button','data-id':sid(c.ticker,s.key)},label(s),s.flags.length?h('span',{class:'flag',text:'注意'}):null,h('small',{text:dshort(s)}));
        b.addEventListener('click',()=>{go(sid(c.ticker,s.key));if(innerWidth<=900)toggleSide(false);});yrs.append(b);});});
    box.append(btn,yrs);tree.append(box);});
  markCurrent();
}
function markCurrent(){const id=curId();
  $$('nav.top [data-go], .mnav [data-go]').forEach(a=>a.setAttribute('aria-current',a.dataset.go===id?'true':'false'));
  $$('.co>button').forEach(b=>{const tk=b.parentNode.dataset.tk;b.setAttribute('aria-current',id==='c-'+tk?'true':'false');if(id.startsWith('s-'+tk+'-')||id==='c-'+tk){b.parentNode.classList.add('expanded');b.setAttribute('aria-expanded','true');}});
  $$('.ss').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id?'true':'false'));}
function toggleSide(v){const s=$('#side');const o=v==null?!s.classList.contains('show'):v;s.classList.toggle('show',o);$('#menu').setAttribute('aria-expanded',o);}
$('#menu').addEventListener('click',()=>toggleSide());
$('#q').addEventListener('input',e=>buildTree(e.target.value));

function footer(){return h('footer',{class:'site'},'內容由 AI 依法說會逐字稿整理，僅供參考，不構成投資建議。逐字稿來源：TEJ 逐字稿資料庫。'+(IDX.site?'本網站使用公開版儀表板，只保留引用的原句。':''));}
function revRows(list){
  return h('div',{class:'tbl'},h('table',{},h('thead',{},h('tr',{},['公司','場次','項目','前次','本次',''].map(t=>h('th',{text:t})))),
    h('tbody',{},list.map(({c,s,o})=>{const tr=h('tr',{class:'go',tabindex:'0'},h('td',{class:'co-n'},h('b',{text:c.name}),h('span',{text:c.ticker!==c.name?c.ticker:''})),
      h('td',{text:label(s)}),h('td',{class:'t',text:o.topic}),h('td',{style:'color:var(--grey)',text:o.prior_value||'—'}),h('td',{text:o.value}),h('td',{},revTag(o.vs_prior)));
      const f=()=>go(sid(c.ticker,s.key));tr.addEventListener('click',f);tr.addEventListener('keydown',e=>{if(e.key==='Enter')f();});return tr;}))));
}

/* 首頁 */
let heroTimer=null,heroIdx=0;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const WD=['一','二','三','四','五','六','日'];
const dow=d=>(d.getDay()+6)%7;
const dlong=k=>{const d=parseD(k);return d?`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日　星期${WD[dow(d)]}`:'';};
const newest=()=>ALL.slice().sort((a,b)=>order(b.s).localeCompare(order(a.s)));
const toneLab=s=>s.tone&&s.tone.presentation&&s.tone.presentation.label;

/* 大圖輪播 */
function carousel(){
  const latest=newest()[0],up=REVS.filter(r=>r.o.vs_prior==='上修').length,down=REVS.filter(r=>r.o.vs_prior==='下修').length,slides=[];
  if(latest){const {c,s}=latest,o=s.outlook.find(x=>x.vs_prior==='上修'||x.vs_prior==='下修');
    slides.push({tag:'最新一場｜'+label(s)+(s.date?'｜'+dshort(s):''),title:o?`${c.name}${o.vs_prior}${o.topic}：${o.value}`:`${c.name} ${label(s)} 法說會`,text:s.summary,
      img:'docs/screenshots/hero.png',alt:'單場儀表板畫面',btns:[['打開這場儀表板',sid(c.ticker,s.key)],c.sessions.length>1?[`看${c.name}的跨季追蹤`,'c-'+c.ticker]:null]});}
  if(up+down)slides.push({tag:'指引修正',title:`${up} 項上修、${down} 項下修`,text:'每一場都和同一家公司的上一場法說會逐項比對，看誰調高、誰調低了自己的說法。紅色是上修、綠色是下修，依台股慣例。',
    img:'docs/screenshots/outlook.png',alt:'指引比對畫面',btns:[['看誰上修、誰下修','revisions']]});
  slides.push({tag:'台灣經濟新報（TEJ）實習專案',title:'每個數字都查得到出處',text:'每一場法說會整理成一頁：這場改變了什麼、每個數字出自哪一句、可以直接複製的報告稿。多場放在一起，就能看出同一家公司的說法怎麼變。',
    img:'docs/screenshots/keydata.png',alt:'關鍵數據與原句畫面',btns:[['怎麼做出來的','about'],['搜尋所有法說會','search']]});
  const box=h('section',{class:'car','aria-roledescription':'carousel','aria-label':'精選內容'}),wrap=h('div',{class:'slides'});
  const els=slides.map((x,i)=>{const img=h('img',{src:x.img,alt:x.alt,loading:i?'lazy':'eager'}),fig=h('figure',{},img);
    const sl=h('div',{class:'slide','aria-roledescription':'slide','aria-label':`第 ${i+1} 張，共 ${slides.length} 張`},
      h('div',{class:'txt'},h('div',{class:'tag',text:x.tag}),h(i?'h2':'h1',{class:'ttl',text:x.title}),x.text?h('p',{text:x.text}):null,
        h('div',{class:'cta'},x.btns.filter(Boolean).map(([t,id],j)=>h('a',{class:'btn'+(j?' ghost':''),'data-go':id,href:'#'+id,text:t})))),fig);
    img.addEventListener('error',()=>{fig.remove();sl.classList.add('noimg');});
    return sl;});
  wrap.append(...els);box.append(wrap);
  if(heroIdx>=els.length)heroIdx=0;
  let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,hover=false;
  const db=els.map((_,i)=>{const b=h('button',{type:'button','aria-label':`第 ${i+1} 張`});b.addEventListener('click',()=>{show(i);restart();});return b;});
  const pp=h('button',{type:'button',class:'pp'});
  const setPP=()=>{pp.textContent=paused?'▶ 播放':'❚❚ 暫停';pp.setAttribute('aria-label',paused?'開始自動播放':'暫停自動播放');};
  pp.addEventListener('click',()=>{paused=!paused;setPP();restart();});
  function show(i){heroIdx=(i+els.length)%els.length;
    els.forEach((e,k)=>{const on=k===heroIdx;e.classList.toggle('on',on);e.setAttribute('aria-hidden',String(!on));e.querySelectorAll('a').forEach(a=>a.tabIndex=on?0:-1);});
    db.forEach((b,k)=>b.setAttribute('aria-current',String(k===heroIdx)));}
  function restart(){clearInterval(heroTimer);heroTimer=null;if(!paused&&els.length>1)heroTimer=setInterval(()=>{if(!hover&&!document.hidden)show(heroIdx+1);},6000);}
  if(els.length>1){
    const L=h('button',{type:'button',class:'arr l','aria-label':'上一張',text:'‹'}),R=h('button',{type:'button',class:'arr r','aria-label':'下一張',text:'›'});
    L.addEventListener('click',()=>{show(heroIdx-1);restart();});R.addEventListener('click',()=>{show(heroIdx+1);restart();});
    box.append(L,R,h('div',{class:'dots'},db,pp));
    box.addEventListener('mouseenter',()=>hover=true);box.addEventListener('mouseleave',()=>hover=false);
    box.addEventListener('focusin',()=>hover=true);box.addEventListener('focusout',()=>hover=false);
    let x0=null;box.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
    box.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40){show(heroIdx+(dx<0?1:-1));restart();}});
  }
  setPP();show(heroIdx);restart();
  return box;
}

/* 指引修正跑馬燈 */
function ticker(){
  const list=REVS.filter(r=>r.o.vs_prior==='上修'||r.o.vs_prior==='下修');if(!list.length)return null;
  const item=(r,dup)=>h('a',{href:'#'+sid(r.c.ticker,r.s.key),class:dup?'dup':null,tabindex:dup?'-1':null,'aria-hidden':dup?'true':null,title:`${r.c.name} ${label(r.s)}：${r.o.topic} ${r.o.vs_prior}，${r.o.value}`},
    h('b',{text:(r.c.ticker!==r.c.name?r.c.ticker+' ':'')+r.c.name}),h('span',{text:r.o.topic}),revTag(r.o.vs_prior),h('span',{class:'v',text:r.o.value.length>24?r.o.value.slice(0,24)+'⋯':r.o.value}));
  return h('div',{class:'tick',role:'region','aria-label':'最新指引修正'},h('b',{class:'lab',text:'指引修正'}),
    h('div',{class:'lane'},h('div',{class:'run',style:`--dur:${Math.max(30,list.length*8)}s`},list.map(r=>item(r,false)),list.map(r=>item(r,true)))));
}

/* 行事曆 */
let calMode='month',calRef=null;
function calendar(){
  const dated=ALL.filter(x=>parseD(x.s.date)),undated=ALL.filter(x=>!parseD(x.s.date)),byDay={};
  dated.forEach(x=>(byDay[x.s.date]=byDay[x.s.date]||[]).push(x));
  if(!calRef){const l=dated.slice().sort((a,b)=>b.s.date.localeCompare(a.s.date))[0];calRef=l?parseD(l.s.date):new Date();}
  const box=h('div',{class:'cal'}),todayK=ymd(new Date());
  const ev=(x,rich)=>{const b=h('button',{type:'button',class:rich?'wev':'ev',title:`${x.c.name} ${label(x.s)} 法說會`},
      rich?[h('b',{text:x.c.name}),h('span',{text:(x.c.ticker!==x.c.name?x.c.ticker+'｜':'')+label(x.s)}),toneLab(x.s)?h('span',{text:'語調 '+toneLab(x.s)}):null]:x.c.name);
    b.addEventListener('click',()=>go(sid(x.c.ticker,x.s.key)));return b;};
  function draw(){
    const y=calRef.getFullYear(),m=calRef.getMonth();let title,grid,n=0;
    if(calMode==='month'){
      title=`${y} 年 ${m+1} 月`;
      const first=new Date(y,m,1),off=dow(first),days=new Date(y,m+1,0).getDate(),weeks=Math.ceil((off+days)/7);
      grid=h('div',{class:'mg'},WD.map(w=>h('div',{class:'wd',text:w})));
      for(let i=0;i<weeks*7;i++){const d=new Date(y,m,1-off+i),k=ymd(d),E=byDay[k]||[];if(d.getMonth()===m)n+=E.length;
        grid.append(h('div',{class:'dc'+(d.getMonth()!==m?' out':'')+(k===todayK?' today':'')},h('span',{class:'d',text:String(d.getDate())}),E.map(x=>ev(x,false))));}
    }else{
      const st=new Date(y,m,calRef.getDate()-dow(calRef)),days=[...Array(7)].map((_,i)=>new Date(st.getFullYear(),st.getMonth(),st.getDate()+i));
      const show=days.slice(5).some(d=>byDay[ymd(d)])?days:days.slice(0,5),en=days[6];
      title=`${st.getFullYear()} 年 ${st.getMonth()+1}/${st.getDate()} – ${en.getMonth()+1}/${en.getDate()}`;
      grid=h('div',{class:'wg',style:`--cols:${show.length}`},show.map(d=>{const k=ymd(d),E=byDay[k]||[];n+=E.length;
        return h('div',{class:'wcol'+(k===todayK?' today':'')},h('div',{class:'wh',text:`${d.getMonth()+1}/${d.getDate()}（${WD[dow(d)]}）`}),E.length?E.map(x=>ev(x,true)):h('span',{class:'none',text:'—'}));}));
    }
    const step=dir=>{calRef=calMode==='month'?new Date(y,m+dir,1):new Date(y,m,calRef.getDate()+7*dir);draw();};
    const seg=h('div',{class:'seg',role:'group','aria-label':'檢視方式'},[['week','週'],['month','月']].map(([k,t])=>{const b=h('button',{type:'button','aria-pressed':String(calMode===k),text:t});
      b.addEventListener('click',()=>{if(calMode===k)return;calMode=k;if(k==='week'){const f=dated.map(x=>parseD(x.s.date)).filter(d=>d.getFullYear()===y&&d.getMonth()===m).sort((a,b)=>a-b)[0];if(f)calRef=f;}draw();});return b;}));
    const nb=(t,lab,f)=>{const b=h('button',{type:'button',class:'nb','aria-label':lab,text:t});b.addEventListener('click',f);return b;};
    const months={};dated.forEach(x=>{const k=x.s.date.slice(0,7);months[k]=(months[k]||0)+1;});
    const jump=h('div',{class:'cal-jump'},'有場次的月份：',Object.keys(months).sort().reverse().map(k=>{const cur=calMode==='month'&&k===`${y}-${pad(m+1)}`;
      const b=h('button',{type:'button',class:'fchip sm','aria-pressed':String(cur)},`${+k.slice(0,4)}/${+k.slice(5)}`,h('em',{class:'num',text:String(months[k])}));
      b.addEventListener('click',()=>{calMode='month';calRef=new Date(+k.slice(0,4),+k.slice(5)-1,1);draw();});return b;}));
    box.replaceChildren(...[
      h('div',{class:'cal-h'},seg,nb('‹',calMode==='month'?'上個月':'上一週',()=>step(-1)),h('b',{class:'num',text:title}),nb('›',calMode==='month'?'下個月':'下一週',()=>step(1)),
        h('span',{class:'sp'},nb('今天','回到今天',()=>{calRef=new Date();draw();}))),
      grid,
      n?null:h('p',{class:'cal-note',text:calMode==='month'?'這個月沒有已分析的場次，可以從下方選有場次的月份。':'這一週沒有已分析的場次。'}),
      dated.length?jump:null,
      undated.length?h('div',{class:'cal-jump'},'日期未標示：',undated.map(x=>link(sid(x.c.ticker,x.s.key),`${x.c.name} ${label(x.s)}`))):null,
      h('p',{class:'cal-note',text:'目前只標出已分析的場次；即將舉行的法說會，之後接上 TEJ 法說會日程資料再補上。'})].filter(Boolean));
  }
  draw();return box;
}

/* 依日期分組的場次列表 */
let listInd='',listAsc=false;
function sessionList(){
  const inds=[...new Set(C.map(c=>c.industry).filter(Boolean))],out=h('div');
  const chips=h('div',{class:'chips',role:'group','aria-label':'依產業篩選'});
  const mk=(lab,val)=>{const b=h('button',{class:'fchip',type:'button','aria-pressed':String(listInd===val)},lab,h('em',{class:'num',text:String(ALL.filter(x=>!val||x.c.industry===val).length)}));
    b.addEventListener('click',()=>{listInd=val;chips.querySelectorAll('.fchip').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');draw();});return b;};
  chips.append(mk('全部',''),...inds.map(i=>mk(i,i)));
  const sb=h('button',{type:'button',class:'nb sort'}),setS=()=>{sb.textContent=listAsc?'日期：舊 → 新':'日期：新 → 舊';};
  sb.addEventListener('click',()=>{listAsc=!listAsc;setS();draw();});setS();
  function draw(){

/* 全站搜尋 */
let lastQ='';
function viewSearch(){
  const inp=h('input',{type:'search',placeholder:'例如：毛利率、CoWoS、資本支出、匯率','aria-label':'搜尋所有法說會'});inp.value=lastQ;
  const out=h('div',{'aria-live':'polite'});
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  function hl(text,re){const f=document.createDocumentFragment();let last=0,m;re.lastIndex=0;while((m=re.exec(text))){f.append(text.slice(last,m.index),h('mark',{text:m[0]}));last=m.index+m[0].length;if(!m[0].length)break;}f.append(text.slice(last));return f;}
  function snip(t,re){re.lastIndex=0;const m=re.exec(t);if(!m)return t;const a=Math.max(0,m.index-40),e=m.index+m[0].length+70;return (a?'⋯':'')+t.slice(a,e)+(e<t.length?'⋯':'');}

    const re=new RegExp(esc(q),'gi');let total=0;const groups=[];
    const has=t=>{re.lastIndex=0;return !!t&&re.test(t);};
    ALL.forEach(({c,s})=>{const hits=[];const add=(type,t)=>{if(has(t))hits.push([type,snip(t,re)]);};
      if((c.name+' '+c.ticker).toLowerCase().includes(q.toLowerCase()))hits.push(['公司',c.name+'　'+c.ticker]);
      add('摘要',s.summary);add('結論',s.conclusion);
      s.outlook.forEach(o=>add('未來展望',o.topic+'：'+o.value+(o.vs_prior?'（'+o.vs_prior+'）':'')));
      (s.key_data||[]).forEach(k=>add('關鍵數據',k.metric+'：'+k.value+(k.change&&k.change!=='—'?'，'+k.change:'')));
      (s.qas||[]).forEach(x=>add('Q&A','Q：'+x.q+'　A：'+x.a+(x.org&&x.org!=='逐字稿未提及'?'（'+x.org+'）':'')));

    groups.slice(0,40).forEach(({c,s,hits})=>{const b=h('button',{type:'button'},'打開這一場');b.addEventListener('click',()=>go(sid(c.ticker,s.key)));
      out.append(h('div',{class:'res'},h('div',{class:'res-h'},h('b',{text:c.name+'　'+label(s)}),h('span',{text:(dshort(s)?dshort(s)+'｜':'')+hits.length+' 處'}),b),
        hits.slice(0,6).map(([t,x])=>h('div',{class:'hit'},h('i',{text:t}),hl(x,re))),hits.length>6?h('div',{class:'hit',style:'color:var(--grey)',text:`還有 ${hits.length-6} 處，打開這一場可看全部`}):null));});}
  let st;inp.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(run,200);});
  const tries=['毛利率','資本支出','CoWoS','匯率','AI','關稅'].map(w=>{const b=h('button',{type:'button',text:w});b.addEventListener('click',()=>{inp.value=w;run();});return b;});

    h('div',{class:'sbox'},inp),h('div',{class:'try'},'試試看：',tries),out,footer()));

function toneChart(ss){
  const W=720,H=220,L=44,R=16,T=16,B=36,pts=ss.map((s,i)=>({x:L+(ss.length===1?(W-L-R)/2:i*(W-L-R)/(ss.length-1)),s}));
  const y=v=>T+(1-(v+1)/2)*(H-T-B),NS='http://www.w3.org/2000/svg',e=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  const svg=e('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'語調分數趨勢'});
  [-1,-.5,0,.5,1].forEach(v=>{svg.append(e('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:v===0?'#9aa6b2':'#dadada','stroke-width':1,'stroke-dasharray':v===0?'':'3 4'}));const t=e('text',{x:L-8,y:y(v)+4,'text-anchor':'end','font-size':11,fill:'#6b7280'});t.textContent=(v>0?'+':'')+v;svg.append(t);});
  [['presentation','#1970b8'],['qa','#8a9bb0']].forEach(([k,col])=>{const P=pts.filter(p=>p.s.tone&&p.s.tone[k]);if(!P.length)return;
    if(P.length>1)svg.append(e('polyline',{points:P.map(p=>p.x+','+y(p.s.tone[k].score)).join(' '),fill:'none',stroke:col,'stroke-width':2.5}));
    P.forEach(p=>{svg.append(e('circle',{cx:p.x,cy:y(p.s.tone[k].score),r:5,fill:col}));const t=e('text',{x:p.x+8,y:y(p.s.tone[k].score)-8,'font-size':12,fill:col,'font-weight':700});t.textContent=fmt(p.s.tone[k].score);svg.append(t);});});
  pts.forEach(p=>{const t=e('text',{x:p.x,y:H-12,'text-anchor':'middle','font-size':12,fill:'#6b7280'});t.textContent=label(p.s);svg.append(t);});
  return h('div',{class:'chart'},svg,h('div',{class:'legend'},h('span',{},h('i',{style:'background:#1970b8'}),'管理層講稿'),h('span',{},h('i',{style:'background:#8a9bb0'}),'Q&A 回答')));
}
