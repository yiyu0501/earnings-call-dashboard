# 每次推送到 main（包括在 GitHub 網頁上傳或刪除 data/ 裡的 HTML），
# 自動重新掃描 data/、產生 index.js，再發布到 GitHub Pages。
name: 發布網站
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 上線前檢查並重新掃描 data/
        # 有任何 HTML 夾帶完整逐字稿就停止，網站不會更新
        run: python integrate.py --target . --site --check
      - name: 產生各公司靜態頁與網站地圖（給搜尋引擎與社群預覽）
        run: python tools/build_seo.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
