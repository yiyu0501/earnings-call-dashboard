# 每個 Pull Request（包括 Dependabot 的版本更新）都先跑完這些檢查，通過才合併
name: 檢查
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 網站與模板一致
        run: cmp index.html skill/earnings-call-dashboard/assets/integrated_template.html
      - name: Python 語法
        run: python -m compileall -q integrate.py skill tools
      - name: 上線前檢查（data/ 不得夾帶完整逐字稿）並重建索引
        run: python integrate.py --target . --site --check
      - name: 產生各公司靜態頁與網站地圖
        run: python tools/build_seo.py
      - name: 安裝瀏覽器
        run: |
          npm install --no-save playwright @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: 網站自動回歸測試
        run: node tools/site_test.js || node tools/site_test.js
      - name: 無障礙檢查（axe-core，僅報告）
        run: node tools/a11y_test.js
      - name: Lighthouse 評分（僅報告）
        run: |
          npx --yes @lhci/cli@0.16.1 autorun
          python tools/lighthouse_summary.py
