<style>
:root{--ink:#0d0d0d;--grey:#6b7280;--app:#f8f8f8;--surface:#fff;--line:#dadada;--primary:#1970b8;--link:#186eb4;--navy:#204383;--deep:#0b2140;--tint:rgba(32,67,131,.1);
 --up:#d62f3c;--down:#14915a;--hdr:60px;--side:280px;--on-dark:#e9f1fa;--on-dark-2:#9fb4cf;--font:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#e8ecf1;--grey:#9aa6b2;--app:#0f1318;--surface:#181d24;--line:#2c3440;--primary:#4d9ee0;--link:#7db8ec;--navy:#a9c3e6;--tint:rgba(169,195,230,.14);--deep:#0a1a33;--up:#ff6b74;--down:#3ccf8e}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.65;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);padding:8px 12px}
header{height:var(--hdr);flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);cursor:pointer}
.brand img{height:30px;width:auto}
@media (prefers-color-scheme:dark){.brand img{background:#fff;border-radius:5px;padding:2px 4px}}
.brand b{display:block;font-size:16px;line-height:1.15}.brand small{display:block;font-size:11px;color:var(--grey);font-weight:600}
nav.top{display:flex;gap:2px;margin-left:24px}
nav.top a{text-decoration:none;color:var(--grey);font-weight:600;font-size:14.5px;padding:6px 12px;border-radius:6px;cursor:pointer}
nav.top a:hover{color:var(--link)}
nav.top a[aria-current=true]{color:var(--primary);background:rgba(25,112,184,.1)}
.menu{display:none;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;height:36px;padding:0 12px;font-weight:600;font-size:14px}
.gen{margin-left:auto;font-size:12px;color:var(--grey)}
.shell{flex:1;display:flex;min-height:0}
aside{width:var(--side);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.find{padding:12px;border-bottom:1px solid var(--line)}
.find input{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font:inherit;font-size:14px;background:var(--app);color:var(--ink)}
.side-t{font-size:12px;font-weight:700;color:var(--grey);padding:10px 16px 2px}
.tree{flex:1;overflow:auto;padding:4px 8px 20px}
.co{margin:2px 0}
.co>button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px;border-radius:6px;text-align:left}
.co>button:hover{background:var(--tint)}
.co>button[aria-current=true]{background:var(--primary);color:#fff}.co>button[aria-current=true] em,.co>button[aria-current=true] .tk{color:#dbeafa}
.co>button i{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;flex-shrink:0;opacity:.7}
.co.expanded>button i{transform:rotate(45deg)}
.co b{font-size:15px}.co em{font-style:normal;font-size:12px;color:var(--grey);margin-left:auto}.co .tk{font-size:12px;color:var(--grey);font-weight:600}
.yrs{display:none;padding:2px 0 6px 18px}.co.expanded .yrs{display:block}
.yr{font-size:12px;font-weight:700;color:var(--grey);margin:6px 8px 2px}
.ss{width:100%;display:flex;gap:8px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:6px;text-align:left;font-size:14px}
.ss:hover{background:var(--tint)}.ss[aria-current=true]{background:var(--tint);color:var(--primary);font-weight:700}
.ss small{margin-left:auto;font-size:11.5px;color:var(--grey)}
.flag{font-size:11px;font-weight:700;color:#b45309;border:1px solid #f0c27a;border-radius:3px;padding:0 5px;white-space:nowrap}
main{flex:1;min-width:0;overflow:auto;position:relative}
.view{padding:28px 32px 56px;max-width:1180px}
.crumb{font-size:13.5px;color:var(--grey);margin-bottom:8px}.crumb a{cursor:pointer;text-decoration:none}
h1{margin:0 0 6px;font-size:30px;line-height:1.25}
h2{font-size:20px;margin:34px 0 12px;display:flex;align-items:baseline;gap:12px}
h2 a{font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.lead{color:var(--grey);margin:0 0 18px;max-width:760px}
.hero{position:relative;background:var(--deep);color:var(--on-dark);padding:44px 32px 50px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.hero>div{position:relative;max-width:1116px}
.hero .tag{font-size:13px;letter-spacing:2px;color:#7fb6e6;font-weight:700}
.hero h1{color:#fff;font-size:clamp(28px,4vw,42px);margin:8px 0 12px}
.hero p{margin:0;max-width:640px;font-size:16.5px;line-height:1.85;color:var(--on-dark)}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,170px));gap:0;margin-top:26px;border-top:1px solid rgba(255,255,255,.18)}
.hstats div{padding:12px 10px 0 0}.hstats b{display:block;font-size:30px;line-height:1.1;color:#fff}.hstats span{font-size:12.5px;color:var(--on-dark-2)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{height:42px;padding:0 18px;border-radius:6px;font-weight:700;font-size:15px;border:1.5px solid #fff;background:#fff;color:#0b2140;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.how b{display:block;font-size:16px;margin:4px 0}.how span{font-size:12.5px;font-weight:700;color:var(--primary)}.how p{margin:0;font-size:14px;color:var(--grey)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding:0 13px;font-size:13.5px;font-weight:600}
.fchip em{font-style:normal;font-size:12px;color:var(--grey);margin-left:4px}
.fchip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}.fchip[aria-pressed=true] em{color:#dbeafa}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:7px;transition:border-color .2s,transform .2s}
.ccard:hover{border-color:var(--primary);transform:translateY(-2px)}
.ccard .t{display:flex;align-items:baseline;gap:8px}.ccard b{font-size:18px}.ccard .tk{font-size:13px;color:var(--grey)}
.ccard p{margin:0;font-size:13px;color:var(--grey)}
.tbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--grey)}
.tbar .rail{flex:1;height:6px;background:var(--tint);border-radius:3px;position:relative}
.tbar .rail i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:var(--primary);transform:translateX(-50%)}
.tbar .rail::after{content:"";position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--grey);opacity:.5}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid var(--primary);color:var(--primary);white-space:nowrap}
.chip.flat{border-color:var(--line);color:var(--grey)}
.rev{font-size:12.5px;font-weight:700;white-space:nowrap}.rev.up{color:var(--up)}.rev.down{color:var(--down)}.rev.keep{color:var(--grey)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--app);font-size:12.5px;color:var(--grey);white-space:nowrap}
td.t{font-weight:700;color:var(--link);white-space:nowrap}
td.co-n{white-space:nowrap}td.co-n b{display:block}td.co-n span{font-size:12.5px;color:var(--grey)}
tr.go{cursor:pointer}tr.go:hover td{background:var(--tint)}
tr:last-child td{border-bottom:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;height:36px;padding:0 12px;font-size:14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.tab em{font-style:normal;font-size:12px;color:var(--grey)}.tab[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}.tab[aria-pressed=true] em,.tab[aria-pressed=true] .rev{color:#fff}
.sbox{display:flex;gap:8px;margin:6px 0 10px}
.sbox input{flex:1;height:46px;border:1.5px solid var(--line);border-radius:8px;padding:0 14px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.sbox input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.try{font-size:13.5px;color:var(--grey);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.try button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:28px;padding:0 11px;font-size:13px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:12px}
.res-h{display:flex;gap:10px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.res-h b{font-size:16px}.res-h span{font-size:13px;color:var(--grey)}
.res-h button{margin-left:auto;border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:6px;height:30px;padding:0 10px;font-size:13px;font-weight:600}
.hit{padding:10px 16px;border-bottom:1px dashed var(--line);font-size:14.5px}.hit:last-child{border-bottom:0}
.hit i{font-style:normal;font-size:12px;font-weight:700;color:var(--primary);margin-right:8px}
mark{background:#fff3a6;color:#0d0d0d;border-radius:2px;padding:0 1px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.scard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.scard .top b{font-size:17px}
.scard p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.scard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13.5px}.scard dt{color:var(--grey)}.scard dd{margin:0}
.openbtn{align-self:flex-start;margin-top:auto;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:6px;height:34px;padding:0 14px;font-weight:700;font-size:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--grey);margin-top:6px}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.note{font-size:13.5px;color:var(--grey);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:12px 14px}
.frame{position:absolute;inset:0;display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface);font-size:14px;flex-shrink:0;flex-wrap:wrap}
.fbar a{cursor:pointer;text-decoration:none}
.fbar .sp{margin-left:auto;display:flex;gap:6px}
.fbar button{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:30px;padding:0 10px;font-size:13px;font-weight:600}
iframe{flex:1;width:100%;border:0;background:var(--app)}
.about{max-width:780px}
.about p,.about li{font-size:15.5px}
.about ul{padding-left:22px}
.box{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:6px;padding:14px 16px;margin:12px 0}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:13px;color:var(--grey)}
.mnav{display:none;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mnav a{text-decoration:none;font-weight:600;font-size:14px;padding:6px 10px;border-radius:6px;background:var(--tint);color:var(--navy);cursor:pointer}
:root{--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--brand:#06348a;--yellow:#f4c51f;--green:#24923b;--hard:#0b2140;--hard-b:#0b2140;--cream:#fbfaf6;--dot:rgba(11,33,64,.13)}
@media (prefers-color-scheme:dark){:root{--hard:#000;--hard-b:#3a4656;--cream:#11161c;--dot:rgba(169,195,230,.12)}}
header{border-bottom:0}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand) 0 25%,var(--primary) 25% 50%,var(--yellow) 50% 75%,var(--green) 75%)}
.num,.mono{font-family:var(--mono)}
.hard{border:2px solid var(--hard-b)!important;box-shadow:6px 6px 0 var(--hard);border-radius:6px}
/* 大圖 */
.car{position:relative;background:var(--deep);color:var(--on-dark);overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 56px),0 100%);z-index:2}
.car::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.car .slides{position:relative;height:600px}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;padding:24px max(72px,calc((100% - 1180px)/2)) 150px;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
.slide.on{opacity:1;visibility:visible}
.slide.noimg{grid-template-columns:minmax(0,820px)}
.crumb2{font-size:13.5px;color:var(--on-dark-2);font-family:var(--mono);letter-spacing:.5px}
.slide .tag{font-size:clamp(17px,1.6vw,22px);letter-spacing:2px;color:#7fb6e6;font-weight:800;margin-top:6px}
.slide .ttl{color:#fff;font-size:clamp(34px,4.6vw,60px);font-weight:900;line-height:1.15;margin:6px 0 14px;letter-spacing:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide p{margin:0;color:var(--on-dark);font-size:16px;line-height:1.85;max-width:600px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slide .cta{margin-top:22px}
.slide.withcmp p{-webkit-line-clamp:2}
.slide .btn{border-radius:4px}
.cmp{width:100%;min-width:0;max-width:600px;margin-top:16px;font-size:13.5px;border-collapse:collapse}
.cmp th{background:none;color:var(--on-dark-2);font-size:12px;border-bottom:1px solid rgba(255,255,255,.25);padding:6px 8px 6px 0}
.cmp td{border-bottom:1px solid rgba(255,255,255,.12);padding:8px 8px 8px 0;color:var(--on-dark)}
.cmp td.k{font-weight:800;color:#fff;white-space:nowrap}.cmp td.p{color:var(--on-dark-2)}.cmp td.v{font-weight:700;color:#fff}
.cmp .rev.up{color:#ff8a92}.cmp .rev.down{color:#5fe0a5}
.blocks{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap}
.blk{min-width:130px;padding:12px 16px 10px;border:2px solid #000;box-shadow:5px 5px 0 #000;background:var(--primary);color:#fff;border-radius:4px}
.blk.up{background:#d62f3c}.blk.down{background:#14915a}
.blk b{display:block;font-size:40px;line-height:1;font-weight:800}.blk span{font-size:14px;font-weight:800}
.slide figure{margin:0;display:flex;align-items:center;justify-content:center;min-height:0}
.slide img{width:100%;max-height:330px;object-fit:cover;object-position:top left;border-radius:4px;border:2px solid #fff;box-shadow:12px 12px 0 var(--yellow);background:#fff}
.car .arr{position:absolute;top:44%;transform:translateY(-50%);width:42px;height:42px;border-radius:4px;border:1.5px solid rgba(255,255,255,.45);background:rgba(11,33,64,.6);color:#fff;font-size:24px;line-height:1;z-index:3;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.car .arr:hover{background:var(--yellow);color:#0b2140;border-color:var(--yellow)}
.car .arr.l{left:16px}.car .arr.r{right:16px}
.dots{position:absolute;bottom:104px;left:max(72px,calc((100% - 1180px)/2));right:max(72px,calc((100% - 1180px)/2));display:flex;gap:14px;z-index:3;align-items:center}
.dots .cnt{font-size:14px;color:#fff;font-weight:700;letter-spacing:1px;white-space:nowrap}
.dots .bar{display:flex;gap:6px;flex:0 1 280px}
.seg1{flex:1;height:5px;border:0;padding:0;background:rgba(255,255,255,.25);position:relative;overflow:hidden;border-radius:0}
.seg1[aria-current=true]{background:rgba(255,255,255,.4)}
.seg1::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.seg1[aria-current=true]::after{transform:scaleX(1)}
.car.playing .seg1.fill::after{animation:segfill 6s linear forwards}
.car.hold .seg1.fill::after{animation-play-state:paused}
@keyframes segfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dots .pp{white-space:nowrap;background:none;border:0;color:var(--on-dark-2);font-size:12px;font-family:var(--mono)}
.scrollhint{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);font-size:12px;letter-spacing:3px;color:var(--on-dark-2);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:1}
.scrollhint i{width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px) rotate(45deg)}}
/* 色帶區塊 */
.band{position:relative;padding:64px 0}
.band .inner{max-width:1180px;margin:0 auto;padding:0 32px}
.band.light{background-color:var(--cream);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px}
.band.first{margin-top:-56px;padding-top:88px}
.band.dark{background:var(--deep);color:var(--on-dark)}
.band.dark::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.band.slant{clip-path:polygon(0 48px,100% 0,100% calc(100% - 48px),0 100%);margin:-48px 0;padding:112px 0;z-index:1}

  const els=slides.map((x,i)=>{let fig=null;

      h('div',{class:'txt'},x.crumb?h('div',{class:'crumb2',text:x.crumb}):null,h('div',{class:'tag',text:x.tag}),h(i?'h2':'h1',{class:'ttl',text:x.title}),x.text?h('p',{text:x.text}):null,x.extra||null,

    return sl;});
  wrap.append(...els);box.append(wrap);

  let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,hover=false;
  const cnt=h('span',{class:'cnt num'}),segs=els.map((_,i)=>{const b=h('button',{type:'button',class:'seg1','aria-label':`第 ${i+1} 張`});b.addEventListener('click',()=>{show(i);restart();});return b;});

/* 行事曆 */
let calMode='month',calRef=null;
function calendar(){
  const dated=ALL.filter(x=>parseD(x.s.date)),undated=ALL.filter(x=>!parseD(x.s.date)),byDay={};
  dated.forEach(x=>(byDay[x.s.date]=byDay[x.s.date]||[]).push(x));
  if(!calRef){const l=dated.slice().sort((a,b)=>b.s.date.localeCompare(a.s.date))[0];calRef=l?parseD(l.s.date):new Date();}
  const box=h('div',{class:'cal hard'}),todayK=ymd(new Date());
  const ev=(x,rich)=>{const b=h('button',{type:'button',class:rich?'wev':'ev',title:`${x.c.name} ${label(x.s)} 法說會`},
      rich?[h('b',{text:x.c.name}),h('span',{text:(x.c.ticker!==x.c.name?x.c.ticker+'｜':'')+label(x.s)}),toneLab(x.s)?h('span',{text:'語調 '+toneLab(x.s)}):null]:x.c.name);
    b.addEventListener('click',()=>go(sid(x.c.ticker,x.s.key)));return b;};
  function draw(){
    const y=calRef.getFullYear(),m=calRef.getMonth();let title,grid,n=0;
    if(calMode==='month'){
      title=`${y} 年 ${m+1} 月`;
      const first=new Date(y,m,1),off=dow(first),days=new Date(y,m+1,0).getDate(),weeks=Math.ceil((off+days)/7);
      grid=h('div',{class:'mg'},WD.map(w=>h('div',{class:'wd',text:w})));
      for(let i=0;i<weeks*7;i++){const d=new Date(y,m,1-off+i),k=ymd(d),E=byDay[k]||[];if(d.getMonth()===m)n+=E.length;
        grid.append(h('div',{class:'dc'+(d.getMonth()!==m?' out':'')+(k===todayK?' today':'')},h('span',{class:'d',text:String(d.getDate())}),E.map(x=>ev(x,false))));}
    }else{
      const st=new Date(y,m,calRef.getDate()-dow(calRef)),days=[...Array(7)].map((_,i)=>new Date(st.getFullYear(),st.getMonth(),st.getDate()+i));
      const show=days.slice(5).some(d=>byDay[ymd(d)])?days:days.slice(0,5),en=days[6];
      title=`${st.getFullYear()} 年 ${st.getMonth()+1}/${st.getDate()} – ${en.getMonth()+1}/${en.getDate()}`;
      grid=h('div',{class:'wg',style:`--cols:${show.length}`},show.map(d=>{const k=ymd(d),E=byDay[k]||[];n+=E.length;
        return h('div',{class:'wcol'+(k===todayK?' today':'')},h('div',{class:'wh',text:`${d.getMonth()+1}/${d.getDate()}（${WD[dow(d)]}）`}),E.length?E.map(x=>ev(x,true)):h('span',{class:'none',text:'—'}));}));
    }
    const step=dir=>{calRef=calMode==='month'?new Date(y,m+dir,1):new Date(y,m,calRef.getDate()+7*dir);draw();};
    const seg=h('div',{class:'seg',role:'group','aria-label':'檢視方式'},[['week','週'],['month','月']].map(([k,t])=>{const b=h('button',{type:'button','aria-pressed':String(calMode===k),text:t});
      b.addEventListener('click',()=>{if(calMode===k)return;calMode=k;if(k==='week'){const f=dated.map(x=>parseD(x.s.date)).filter(d=>d.getFullYear()===y&&d.getMonth()===m).sort((a,b)=>a-b)[0];if(f)calRef=f;}draw();});return b;}));
    const nb=(t,lab,f)=>{const b=h('button',{type:'button',class:'nb','aria-label':lab,text:t});b.addEventListener('click',f);return b;};
    const months={};dated.forEach(x=>{const k=x.s.date.slice(0,7);months[k]=(months[k]||0)+1;});
    const jump=h('div',{class:'cal-jump'},'有場次的月份：',Object.keys(months).sort().reverse().map(k=>{const cur=calMode==='month'&&k===`${y}-${pad(m+1)}`;
      const b=h('button',{type:'button',class:'fchip sm','aria-pressed':String(cur)},`${+k.slice(0,4)}/${+k.slice(5)}`,h('em',{class:'num',text:String(months[k])}));
      b.addEventListener('click',()=>{calMode='month';calRef=new Date(+k.slice(0,4),+k.slice(5)-1,1);draw();});return b;}));
    box.replaceChildren(...[
      h('div',{class:'cal-h'},seg,nb('‹',calMode==='month'?'上個月':'上一週',()=>step(-1)),h('b',{class:'num',text:title}),nb('›',calMode==='month'?'下個月':'下一週',()=>step(1)),
        h('span',{class:'sp'},nb('今天','回到今天',()=>{calRef=new Date();draw();}))),
      grid,
      n?null:h('p',{class:'cal-note',text:calMode==='month'?'這個月沒有已分析的場次，可以從下方選有場次的月份。':'這一週沒有已分析的場次。'}),
      dated.length?jump:null,
      undated.length?h('div',{class:'cal-jump'},'日期未標示：',undated.map(x=>link(sid(x.c.ticker,x.s.key),`${x.c.name} ${label(x.s)}`))):null,
      h('p',{class:'cal-note',text:'目前只標出已分析的場次；即將舉行的法說會，之後接上 TEJ 法說會日程資料再補上。'})].filter(Boolean));
  }
  draw();return box;
}
