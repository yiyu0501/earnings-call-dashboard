<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="earnings-call-dashboard skill">
<title>{{PAGE_TITLE}}</title>
<style>
  /* 樣式數值依 references/layout.md，請勿修改 */
  :root{
    --font:system-ui,Helvetica,Arial,"Noto Sans TC",sans-serif;
    --fs:16px;
    --ink:#0d0d0d; --grey:#717171; --app:#f8f8f8; --surface:#ffffff; --footer:#eeeeee;
    --primary:#1970b8; --link:#186eb4; --crumb:#0f548d; --navy:#204383;
    --line:#dadada; --outline:rgba(13,13,13,.38);
    --band:rgba(23,103,169,.05); --th:rgba(26,115,188,.2); --tint:rgba(32,67,131,.1);
    --pager-on:rgba(25,112,184,.12); --chip-x:rgba(13,13,13,.1); --mark:#fff3a6;
    --x-btn:rgba(13,13,13,.87); --clear:rgba(13,13,13,.5); --caret:rgba(13,13,13,.6);
    --grad:linear-gradient(85deg,#1562be 20.01%,#2cb1b1 81.34%);
    --elev:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12);
  }
  html.fs-l{--fs:18px} html.fs-s{--fs:14px}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--app);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.5}
  a{color:var(--link)}
  a:hover{text-decoration:underline}
  button{font-family:var(--font);cursor:pointer}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  svg{display:block}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sr:focus{position:static;width:auto;height:auto;clip:auto;display:inline-block;padding:4px 8px}
  .acc{color:var(--ink);text-decoration:none;font-size:16px;letter-spacing:1px}

  /* 頁首 */
  header{max-width:1280px;margin:0 auto;padding:8px 16px;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
  .brand:hover{text-decoration:none}
  .brand img{height:38px;width:auto}
  .brand b{display:block;font-size:20px;font-weight:700;line-height:1.2;letter-spacing:1px}
  .brand small{display:block;font-size:10.5px;font-weight:600;line-height:1.2}
  nav.menu{display:flex;align-items:center;gap:22px;font-size:15px;font-weight:600}
  nav.menu a{color:var(--ink);text-decoration:none}
  .dd{position:relative}
  .dd>button{background:none;border:0;padding:0;font-size:15px;font-weight:600;color:var(--ink)}
  .dd>button::after{content:" ⌄";font-size:12px}
  .dd ul{display:none;position:absolute;top:28px;left:0;z-index:10;min-width:180px;margin:0;padding:4px 0;list-style:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--elev);border-radius:4px}
  .dd.open ul{display:block}
  .dd li a{display:block;padding:8px 16px;font-weight:400}
  .dd li a:hover{background:var(--band)}
  .fsw{display:flex;gap:8px}
  .fsw button{background:none;border:0;padding:0;font-size:15px;font-weight:600;color:var(--ink)}
  .fsw button.on{color:var(--primary);text-decoration:underline}
  .burger{display:none;background:none;border:0;padding:8px}
  .burger i{display:block;width:26px;height:3px;background:var(--ink);margin:5px 0}
  @media (max-width:960px){
    nav.menu{display:none;position:absolute;top:72px;right:16px;z-index:10;flex-direction:column;align-items:flex-start;gap:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--elev);border-radius:4px;padding:16px}
    nav.menu.open{display:flex}
    .burger{display:block}
    header{position:relative}
  }

  main{max-width:1280px;margin:0 auto;padding:0 16px 48px}

  /* 麵包屑 */
  .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0 20px;font-size:16px;font-weight:600;line-height:25.6px}
  .crumb a{color:var(--crumb);text-decoration:none;display:flex;align-items:center;gap:6px;padding:0 4px}
  .crumb .sep{color:var(--crumb)}
  .crumb .now{color:var(--grey);padding:0 4px}

  /* 搜尋 */
  .searchbar{display:flex;align-items:center;max-width:640px;margin:16px auto 48px}
  .searchbar-input{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;height:56px;padding-left:16px}
  .searchbar-input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:var(--font);font-size:16px;color:var(--ink);letter-spacing:.15px}
  .searchbar-input input::placeholder{color:var(--ink);font-weight:700}
  .searchbar-input:focus-within{outline:2px solid var(--primary);outline-offset:2px}
  .btn-search{flex-shrink:0;margin:0 8px;height:54px;min-width:96px;padding:0 16px;border:0;border-radius:8px;background:var(--grad);color:#ffffff;font-size:14.4px;font-weight:700;letter-spacing:1.29px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--elev)}
  .hitnav{display:none;gap:8px;align-items:center;justify-content:center;margin:-32px 0 32px;font-size:15px}
  .hitnav.on{display:flex}
  .hitnav button{height:32px;padding:0 12px;border:1px solid var(--primary);border-radius:4px;background:transparent;color:var(--primary);font-size:14px;font-weight:500}

  /* 版面 */
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
  @media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
  aside h2{font-size:24px;font-weight:700;line-height:36px;margin:0 0 4px}
  .filter-info{color:var(--grey);margin:0}
  .filter-info b{font-weight:400;color:var(--ink)}
  .btns{display:flex;gap:16px;margin-top:32px}
  .btn-primary{flex:1;height:44px;border:0;border-radius:4px;background:var(--primary);color:#ffffff;font-size:16px;font-weight:500;letter-spacing:1.43px;box-shadow:var(--elev)}
  .btn-outline{height:44px;padding:0 12px;border:1px solid var(--primary);border-radius:4px;background:transparent;color:var(--primary);font-size:16px;font-weight:500;letter-spacing:1.43px}
  .filter-name{background:var(--band);color:var(--link);font-size:18px;font-weight:700;line-height:27px;padding:12px;margin-top:20px}
  .field{position:relative;margin-top:8px;min-height:40px;border:1px solid var(--outline);border-radius:4px;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 16px;background:transparent}
  .field .chips{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
  .field select{flex:1;min-width:90px;border:0;outline:0;background:transparent;font-family:var(--font);font-size:16px;font-weight:700;color:var(--ink);appearance:none;letter-spacing:.15px;padding:4px 0}
  .field .label{flex:1;font-weight:700;letter-spacing:.15px}
  .caret{border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid var(--caret);flex-shrink:0}
  .chip-x{display:inline-flex;align-items:center;gap:6px;height:28px;background:var(--chip-x);border-radius:4px;padding:0 6px 0 10px;font-size:14px}
  .chip-x button,.clear{width:18px;height:18px;border-radius:50%;border:0;background:var(--x-btn);color:#ffffff;display:grid;place-items:center;padding:0;flex-shrink:0}
  .clear{width:22px;height:22px;background:var(--clear)}

  /* 工具列 */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:12px}
  .toolbar .count{font-size:16px}
  .pager{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
  .pager>button,.pager>a,.pager>span{min-width:48px;height:48px;border:0;border-radius:4px;background:transparent;color:var(--link);font-size:15px;font-weight:500;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;padding:0 6px}
  .pager .on{background:var(--pager-on)}
  .pager button:disabled{opacity:.38;cursor:default}
  .pager .n{font-size:13px;display:block;line-height:1.1}

  /* 模組 */
  .mod{margin-bottom:28px;scroll-margin-top:16px}
  .mod.hide{display:none}
  .mod-head{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;text-align:left;cursor:pointer;margin-top:0;font-family:var(--font)}
  .mod-head .caret{border-top-color:var(--link);transition:transform .2s}
  .mod.closed .mod-head .caret{transform:rotate(-90deg)}
  .mod.closed .mod-body{display:none}
  .mod-body{background:var(--surface);border:1px solid var(--line);border-top:0;padding:14px 16px}
  .mod-body.flush{padding:0;border:0}
  .mod-body.lead{border-bottom:0}
  .mod-body.lead p{margin:0}
  .mod-body p{margin:0}
  .des{color:var(--grey);font-size:14.4px;line-height:21.6px}
  .note{padding:8px 2px 0}
  mark{background:var(--mark);color:inherit;padding:0 1px}
  mark.cur{outline:2px solid var(--primary)}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  @media (max-width:960px){.table-scroll table{min-width:560px}}
  table{width:100%;border-collapse:collapse}
  th{background:var(--th);font-weight:700;text-align:center;padding:4px 8px;border:1px solid var(--line);line-height:32px;white-space:nowrap}
  td{background:var(--surface);border:1px solid var(--line);padding:8px;vertical-align:middle}
  td.c{text-align:center}
  td .name{color:var(--link);font-weight:700}
  td .des{margin-top:2px}
  .tags{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tags.kw{margin:0;gap:8px}
  .chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border:1px solid var(--primary);border-radius:4px;color:var(--primary);font-size:12px;font-weight:600;white-space:nowrap}
  .chip.fmt{border-color:transparent;background:var(--tint);color:var(--navy)}
  .chip.flat{border-color:var(--line);color:var(--grey)}
  .chip.sm{height:20px;padding:0 6px}
  .bar{height:8px;background:var(--pager-on);margin:6px 0 2px}
  .bar i{display:block;height:100%;background:var(--primary)}
  .bar.navy i{background:var(--navy)}
  .big{font-size:24px;font-weight:700;line-height:36px}
  .qa-row{cursor:pointer}
  .qa-row .more{display:none;margin-top:6px}
  .qa-row.open .more{display:block}
  .qa-row .tog{color:var(--link);font-weight:600;white-space:nowrap;background:none;border:0;padding:0;font-size:inherit}
  .empty{color:var(--grey)}

  .totop{position:fixed;right:20px;bottom:20px;width:48px;height:48px;border-radius:50%;border:0;background:var(--primary);color:#ffffff;box-shadow:var(--elev);display:grid;place-items:center}

  footer{background:var(--footer);padding:8px 16px 32px}
  footer .in{max-width:1280px;margin:0 auto;font-size:15px;line-height:1.8}
  footer p{margin:0}
  footer .lockup{display:block;height:70px;width:auto;margin:12px 0 10px}
</style>
</head>
<body>
<a class="sr" href="#main">跳至主要內容</a>
<header>
  <a class="brand" href="#main">
    <img src="data:image/png;base64,{{LOGO_MARK}}" alt="TEJ 台灣經濟新報">
    <div><b>法說會儀表板</b><small>TEJ Earnings Call Dashboard</small></div>
  </a>
  <nav class="menu" id="menu" aria-label="主選單">
    <a class="acc" href="#menu" title="上方導覽區">:::</a>
    <div class="dd" id="toc">
      <button type="button" aria-expanded="false" aria-controls="toc-list" onclick="toggleToc()">模組目錄</button>
      <ul id="toc-list">{{TOC_ITEMS}}</ul>
    </div>
    <a href="#about">資料來源</a>
    <div class="fsw" role="group" aria-label="字級">
      <button type="button" onclick="setFs('l')" id="fs-l">大</button>
      <button type="button" onclick="setFs('m')" id="fs-m" class="on" aria-pressed="true">中</button>
      <button type="button" onclick="setFs('s')" id="fs-s">小</button>
    </div>
  </nav>
  <button class="burger" type="button" aria-label="開啟選單" aria-controls="menu" onclick="document.getElementById('menu').classList.toggle('open')"><i></i><i></i><i></i></button>
</header>

<main id="main">
  <nav class="crumb" aria-label="導覽路徑">
    <a href="#main"><svg width="20" height="18" viewBox="0 0 24 22" aria-hidden="true"><path fill="#0f548d" d="M12 1 1 10.5h3.2V21h5.6v-6.5h4.4V21h5.6V10.5H23z"/></svg>首頁</a>
    <span class="sep">/</span><a href="#main">{{COMPANY}}</a>
    <span class="sep">/</span><span class="now">{{SESSION_LABEL}} 法說會</span>
  </nav>

  <a class="acc" href="#q" title="中央內容區塊">:::</a>

  <form class="searchbar" onsubmit="doSearch(event)" role="search">
    <div class="searchbar-input">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#0d0d0d" stroke-width="2.2"/><path d="M12 10.5v6" stroke="#0d0d0d" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.2" r="1.4" fill="#0d0d0d"/></svg>
      <label class="sr" for="q">搜尋逐字稿原文</label>
      <input id="q" placeholder="請輸入檢索詞">
    </div>
    <button class="btn-search" type="submit"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" fill="none" stroke="#ffffff" stroke-width="2.6"/><path d="m15.8 15.8 5.4 5.4" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/></svg>搜尋</button>
  </form>
  <div class="hitnav" id="hitnav" aria-live="polite">
    <button type="button" onclick="jump(-1)">上一筆</button><span id="hitpos"></span><button type="button" onclick="jump(1)">下一筆</button>
  </div>

  <div class="layout">
    <aside>
      <h2>{{COMPANY}}法說會</h2>
      <p class="filter-info" id="cond">搜尋條件：</p>

      <div class="btns">
        <button class="btn-primary" type="button" onclick="applyFilter()">篩選</button>
        <button class="btn-outline" type="button" onclick="resetAll()">重設</button>
      </div>

      <div class="filter-name">顯示模組</div>
      <div class="field">
        <div class="chips" id="chips"></div>
        <button class="clear" type="button" aria-label="清除全部模組" onclick="staged.clear();renderChips()"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <span class="caret" aria-hidden="true"></span>
      </div>

      <div class="filter-name">展開方式</div>
      <div class="field">
        <select id="openMode" aria-label="展開方式"><option value="open">全部展開</option><option value="closed">全部收合</option></select>
        <span class="caret" aria-hidden="true"></span>
      </div>

      <div class="filter-name">公司</div>
      <div class="field"><span class="label">{{COMPANY_FIELD}}</span><span class="caret" aria-hidden="true"></span></div>

      <div class="filter-name">產業</div>
      <div class="field"><span class="label">{{INDUSTRY}}</span><span class="caret" aria-hidden="true"></span></div>
    </aside>

    <section aria-label="儀表板內容">
      <div class="toolbar">
        <span class="count" id="count">共 {{MODULE_COUNT}} 個模組</span>
        <div class="pager" aria-label="場次切換">{{PAGER}}</div>
      </div>
{{MODULES}}
    </section>
  </div>
</main>

<button class="totop" type="button" aria-label="回到頂端" onclick="scrollTo({top:0,behavior:'smooth'})"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<footer id="about">
  <div class="in">
    <a class="acc" href="#about" title="下方功能區塊">:::</a>
    <img class="lockup" src="data:image/png;base64,{{LOGO_LOCKUP}}" alt="TEJ 台灣經濟新報 Taiwan Economic Journal">
{{FOOTER}}
  </div>
</footer>

<script>
  const mods=[...document.querySelectorAll('.mod')];
  const all=mods.map(m=>m.dataset.mod);
  let shown=new Set(all), staged=new Set(all);
  const quotes=[...document.querySelectorAll('.quote')];
  const orig=new Map(quotes.map(q=>[q,q.innerHTML]));
  const xs='<svg width="8" height="8" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/></svg>';
  let hits=[], hitIdx=0;

  function renderChips(){
    const box=document.getElementById('chips');box.innerHTML='';
    all.filter(n=>staged.has(n)).forEach(n=>{
      const c=document.createElement('span');c.className='chip-x';
      c.textContent=n;
      const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','移除 '+n);b.innerHTML=xs;
      b.onclick=()=>{staged.delete(n);renderChips()};
      c.appendChild(b);box.appendChild(c);
    });
    const rest=all.filter(n=>!staged.has(n));
    if(rest.length){
      const s=document.createElement('select');s.setAttribute('aria-label','加入模組');
      const o=document.createElement('option');o.value='';o.textContent='搜尋/選擇';s.appendChild(o);
      rest.forEach(n=>{const x=document.createElement('option');x.textContent=n;s.appendChild(x)});
      s.onchange=()=>{if(s.value){staged.add(s.value);renderChips()}};
      box.appendChild(s);
    }
  }
  function render(){
    mods.forEach(m=>m.classList.toggle('hide',!shown.has(m.dataset.mod)));
    document.getElementById('count').textContent='共 '+shown.size+' 個模組';
  }
  function applyFilter(){
    shown=new Set(staged);
    const mode=document.getElementById('openMode').value;
    mods.forEach(m=>m.classList.toggle('closed',mode==='closed'));
    render();
  }
  function fold(b){const m=b.parentNode;m.classList.toggle('closed');b.setAttribute('aria-expanded',!m.classList.contains('closed'))}
  function toggleQa(row){row.classList.toggle('open')}
  function toggleToc(){const d=document.getElementById('toc');d.classList.toggle('open');d.querySelector('button').setAttribute('aria-expanded',d.classList.contains('open'))}
  function goMod(id){
    const m=document.getElementById(id);if(!m)return false;
    if(m.classList.contains('hide')){shown.add(m.dataset.mod);staged.add(m.dataset.mod);render();renderChips()}
    m.classList.remove('closed');document.getElementById('toc').classList.remove('open');
    m.scrollIntoView({behavior:'smooth',block:'start'});return false;
  }
  function setFs(k){
    document.documentElement.classList.remove('fs-l','fs-s');
    if(k!=='m')document.documentElement.classList.add('fs-'+k);
    ['l','m','s'].forEach(x=>{const b=document.getElementById('fs-'+x);b.classList.toggle('on',x===k);b.setAttribute('aria-pressed',x===k)});
  }
  function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function showHit(){
    hits.forEach(h=>h.classList.remove('cur'));
    if(!hits.length)return;
    const h=hits[hitIdx];h.classList.add('cur');
    document.getElementById('hitpos').textContent=(hitIdx+1)+' / '+hits.length;
    h.scrollIntoView({behavior:'smooth',block:'center'});
  }
  function jump(d){if(!hits.length)return;hitIdx=(hitIdx+d+hits.length)%hits.length;showHit()}
  function doSearch(e){
    e.preventDefault();
    const k=document.getElementById('q').value.trim();
    let n=0;
    const re=k?new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'):null;
    quotes.forEach(q=>{
      const h=orig.get(q);
      if(re&&q.textContent.includes(k)){
        n++;q.innerHTML=h.replace(re,'<mark>$&</mark>');
        const row=q.closest('.qa-row');if(row)row.classList.add('open');
        const m=q.closest('.mod');m.classList.remove('closed');shown.add(m.dataset.mod);staged.add(m.dataset.mod);
      }else q.innerHTML=h;
    });
    render();renderChips();
    document.getElementById('cond').innerHTML=k?'搜尋條件： <b>關鍵字 '+esc(k)+'</b>，共 '+n+' 段原文符合':'搜尋條件：';
    hits=[...document.querySelectorAll('mark')];hitIdx=0;
    document.getElementById('hitnav').classList.toggle('on',hits.length>1);
    showHit();
  }
  function resetAll(){
    staged=new Set(all);shown=new Set(all);
    document.getElementById('openMode').value='open';
    mods.forEach(m=>m.classList.remove('closed'));
    document.querySelectorAll('.qa-row').forEach(r=>r.classList.remove('open'));
    document.getElementById('q').value='';
    doSearch({preventDefault(){}});
  }
  document.addEventListener('click',e=>{const d=document.getElementById('toc');if(!d.contains(e.target))d.classList.remove('open')});
  renderChips();render();
</script>
</body>
</html>
